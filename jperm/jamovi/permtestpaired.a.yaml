---
name: permtestpaired
title: Test permutacyjny dla prób sparowanych
menuGroup: Testy permutacyjne
menuTitle: Próby sparowane
menuSubtitle: dwa pomiary tej samej jednostki
version: '2.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: pairs
      title: Pary zmiennych
      type: Pairs
      suggested:
        - continuous
      permitted:
        - numeric

    - name: hypothesis
      title: Hipoteza alternatywna
      type: List
      options:
        - title: Dwustronna (≠)
          name: different
        - title: Większa (>)
          name: greater
        - title: Mniejsza (<)
          name: less
      default: different

    - name: plot
      title: Wykres rozkładu permutacyjnego
      type: Bool
      default: true

    # --- zaawansowane ---
    - name: nPerm
      title: Liczba permutacji (Monte Carlo)
      type: Integer
      default: 10000
      min: 100
      max: 100000

    - name: seed
      title: Ziarno generatora (0 = bez ustawiania)
      type: Integer
      default: 0
      min: 0

    - name: exact
      title: Test dokładny (wszystkie układy, gdy wykonalny)
      type: Bool
      default: false

    # --- opis metod (wspólny mechanizm jUPWR: jmvcore::metodyNew) ---
    - name: metody
      title: Opis zastosowanych metod
      type: Bool
      default: false
...

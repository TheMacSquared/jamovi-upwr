---
name: permtestone
title: Test permutacyjny dla jednej próby
jrs: '1.1'

items:
    - name: table
      title: Test permutacyjny dla jednej próby
      type: Table
      rows: 0
      clearWith: &cw
        - vars
        - testValue
        - hypothesis
        - nPerm
        - seed
        - exact
      columns:
        - name: var
          title: ''
          type: text
        - name: stat
          title: Średnia − wartość testowa
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: nPerm
          title: Liczba układów
          type: integer

    - name: plots
      title: Rozkład permutacyjny
      type: Array
      visible: (plot)
      clearWith: *cw
      template:
        title: ''
        type: Image
        width: 520
        height: 380
        renderFun: .permPlot

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

title: Test permutacyjny dla dwóch grup
name: permtesttwo
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienne
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Zmienna grupująca
        children:
          - type: VariablesListBox
            name: group
            isTarget: true
            maxItemCount: 1

  # --- rdzeń: nazwy sekcji jak w jTestyT ---
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Hipoteza
            children:
              - type: ComboBox
                name: hypothesis
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Wykres
            children:
              - type: CheckBox
                name: plot
          - type: Label
            label: Opis metod
            children:
              - type: CheckBox
                name: metody

  # --- zaawansowane: parametry losowania ---
  - type: CollapseBox
    label: Zaawansowane
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: Label
            label: Permutacje
            children:
              - type: TextBox
                name: nPerm
                format: number
              - type: TextBox
                name: seed
                format: number
              - type: CheckBox
                name: exact

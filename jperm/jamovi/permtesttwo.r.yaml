---
name: permtesttwo
title: Test permutacyjny dla dwóch grup
jrs: '1.1'

items:
    - name: table
      title: Test permutacyjny dla dwóch grup
      type: Table
      rows: 0
      clearWith: &cw
        - vars
        - group
        - hypothesis
        - nPerm
        - seed
        - exact
      columns:
        - name: var
          title: ''
          type: text
        - name: group1
          title: Grupa 1
          type: text
        - name: group2
          title: Grupa 2
          type: text
        - name: stat
          title: Różnica średnich
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: nPerm
          title: Liczba układów
          type: integer

    - name: plots
      title: Rozkład permutacyjny
      type: Array
      visible: (plot)
      clearWith: *cw
      template:
        title: ''
        type: Image
        width: 520
        height: 380
        renderFun: .permPlot

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

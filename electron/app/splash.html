<html>
  <head>
    <style type="text/css">
        body {
            margin: 0 ;
            background-color: transparent ;
            overflow: hidden ;
        }

        #container {
            height: 30px;
            width: 200px;
            position: absolute;
            top: 35px;
            left: 168px;
            transition: .3s top;
        }

        .label {
            height: 30px;
            line-height: 25px;
            vertical-align: middle;
            font-size: 18px;
            color: #832034;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
        }

        #msg {
            height: 15px;
            width: 200px;
            line-height: 13px;
            vertical-align: middle;

            opacity: 0;
            transition: .5s opacity;
            font-size: 10px;
            color: #832034;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
        }

        .box {
            width: 380px;
            height: 100px;
            position: absolute;
            left: 0px;
            top: 0px;
            transition: .2s opacity;
            border: 1px solid #aaaaaa;
            background-color: white;
            border-radius: 0px;
            overflow: hidden;
        }

        .bar {
            border-left: 2px solid #aaaaaa;
            height: 66px;
            top: 50%;
            margin-top: -33px;
            left: 143px;
            position: absolute;
        }



        .icon {
            width:100px;
            height:100px;
            top:50%;
            left: 22px;
            margin-top: -50px;
            position: absolute;
        }

        .spinner2 {
            animation: rotate 1s linear infinite;
            -webkit-animation: rotate 1s linear infinite;
            -moz-animation: rotate 1s linear infinite;
            width:131px;
            height:131px;
            top:-50px;
            left: -31px;
            position: absolute;
        }

        .spinner3 {
            animation: rotate 1.4s linear infinite;
            -webkit-animation: rotate 1.4s linear infinite;
            -moz-animation: rotate 1.4s linear infinite;
            width:135px;
            height:135px;
            top:-50px;
            left: -31px;
            position: absolute;
        }

        .spinner {
            animation: rotate 1.8s linear infinite;
            -webkit-animation: rotate 1.8s linear infinite;
            -moz-animation: rotate 1.8s linear infinite;
            width:129px;
            height:129px;
            top:-50px;
            left: -31px;
            position: absolute;
        }

        .spinner-dot {
            width:274px;
            height:274px;
            position: relative;
            top: 0;
        }


        @keyframes rotate {
            to {
                transform: rotate(-360deg);
            }
        }

        @-webkit-keyframes rotate {
            to {
                -webkit-transform: rotate(-360deg);
            }
        }

        @-moz-keyframes rotate {
            to {
                transform: rotate(-360deg);
            }
        }

        .path {
            stroke-dasharray: 170;
            stroke-dashoffset: 20;
        }
    </style>
    <script>
        setTimeout(() => {
            let msg = document.getElementById("msg");
            msg.style.opacity = "1";
            let container = document.getElementById("container");
            container.style.height = "45px";
            container.style.top = "27.5px";

        }, 10000);
    </script>
  </head>
  <body>
    <div class="box">
        <div class="bar"></div>
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <text x="32" y="36" text-anchor="middle" font-family="'Libre Baskerville',Georgia,serif" font-size="30" font-weight="700" fill="#832034">jU</text>
            <rect x="24.43" y="44" width="26.34" height="4" rx="2" fill="#E6AC41"></rect>
        </svg>
        <svg class="spinner" width="174px" height="174px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
            <circle class="path" fill="transparent" stroke-width="3" cx="33" cy="33" r="30" stroke="url(#gradient)"/>
                <linearGradient id="gradient">
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </linearGradient>
            </circle>
            <svg class="spinner-dot dot" width="5px" height="5px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg" x="37" y="1.5">
                <circle class="path" fill="#832034" cx="33" cy="33" r="30"/>
                </circle>
            </svg>
        </svg>

        <svg class="spinner2" width="174px" height="174px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
            <circle class="path" fill="transparent" stroke-width="3" cx="33" cy="33" r="30" stroke="url(#gradient)"/>
               <linearGradient id="gradient">
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
               </linearGradient>
            </circle>
            <svg class="spinner-dot dot" width="5px" height="5px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg" x="37" y="1.5">
                <circle class="path" fill="#832034" cx="33" cy="33" r="30"/>
                </circle>
            </svg>
        </svg>

        <svg class="spinner3" width="174px" height="174px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
            <circle class="path" fill="transparent" stroke-width="3" cx="33" cy="33" r="30" stroke="url(#gradient)"/>
               <linearGradient id="gradient">
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
               </linearGradient>
            </circle>
            <svg class="spinner-dot dot" width="5px" height="5px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg" x="37" y="1.5">
                <circle class="path" fill="#832034" cx="33" cy="33" r="30"/>
                </circle>
            </svg>
        </svg>

         <div id="container">
            <div class="label">uruchamianie jUPWR…</div>
            <div id="msg">pierwsze uruchomienie trwa dłużej</div>
         </div>
    </div>
  </body>
</html>

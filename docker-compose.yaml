services:
  # posit publish rstudio/r-base for linux/amd64 only, so we build their
  # (arch-agnostic) recipe ourselves to get a multi-arch base
  r-base:
    image: jamovi/r-base:4.6.0-resolute
    build:
      context: .
      dockerfile: docker/r-base-Dockerfile
    profiles:
      - donotstart

  jamovi-deps:
    image: jamovi/jamovi-deps:28.1
    build:
      context: .
      dockerfile: docker/deps-Dockerfile
    profiles:
      - donotstart

  jamovi: &base
    image: jupwr/jupwr:0.9.2.1
    container_name: jamovi
    profiles: [main]
    build:
      context: .
      dockerfile: docker/jamovi-Dockerfile
    # bind tylko do pętli zwrotnej: serwer startuje z --if=* i pustym
    # JAMOVI_ACCESS_KEY, a kontener ma podmontowany katalog Dokumenty — bez
    # adresu hosta Docker wystawiłby to na 0.0.0.0, czyli całej sieci lokalnej
    # (uczelniane wifi, sala komputerowa). Dziedziczą to też jamovi-dev i test.
    ports:
      - '127.0.0.1:41337:41337'
      - '127.0.0.1:41338:41338'
      - '127.0.0.1:41339:41339'
    command: ["/usr/bin/python3 -u -m jamovi.server 41337 --if=*"]
    stdin_open: true
    stop_grace_period: 0.1s
    environment: &base_env

        # block Rj - don't enable unless you understand the risks!
        JAMOVI_ALLOW_ARBITRARY_CODE: 'false'

        # for security, jamovi runs across 3 origins
        #
        # # separate by port
        JAMOVI_HOST_A: 'localhost:41337'
        JAMOVI_HOST_B: 'localhost:41338'
        JAMOVI_HOST_C: 'localhost:41339'

        # separate by host (RECOMMENDED)
        # JAMOVI_HOST_A: 'jamovi.127.0.0.1.nip.io:41337'
        # JAMOVI_HOST_B: 'a.jamovi.127.0.0.1.nip.io:41337'
        # JAMOVI_HOST_C: 'r.jamovi.127.0.0.1.nip.io:41337'

        # separate by path (NOT RECOMMENDED! REDUCES SECURITY!)
        # JAMOVI_HOST_A: 'jamovi.127.0.0.1.nip.io:41337'
        # JAMOVI_HOST_B: 'jamovi.127.0.0.1.nip.io:41337/analyses'
        # JAMOVI_HOST_C: 'jamovi.127.0.0.1.nip.io:41337/results'

        # prevent unauthorized access
        # JAMOVI_ACCESS_KEY: 'yourpasswordhere'
        # then access jamovi with ?access_key=yourpasswordhere added to the url
        # i.e. 127.0.0.1:41337/?access_key=yourpasswordhere
        # or alternatively, remove the password requirement:
        JAMOVI_ACCESS_KEY: ''

    volumes:
      - ${USERPROFILE:-${HOME}}/Documents:/root/Documents

  jamovi-dev:
    <<: *base
    container_name: jamovi-dev
    profiles: [dev]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *base_env
      JAMOVI_DEV_SERVER: "http://vite:5173"

  test:
    <<: *base
    container_name: jamovi-tests
    profiles: [tests]
    command: ["/usr/bin/python3 -u -m pytest /usr/lib/jamovi/server/jamovi/tests"]

  vite:
      image: jonathonlove/vite:latest
      container_name: vite
      profiles: [dev]
      user: '1000:1000'
      read_only: true
      cap_drop:
        - ALL
      security_opt:
        - no-new-privileges:true
      environment:
        HOME: /tmp/dev-home
      tmpfs:
        - /tmp:mode=1777
        # esbuild installs a native executable in node_modules.
        - /source/client/node_modules:exec,mode=1777
      # The old unionfs-fuse overlay required a fully privileged container.
      # Mount the generated-protocol source directly into client/assets instead;
      # Vite only needs read access to the repository and writes node_modules
      # into the container filesystem.
      command: [ 'mkdir -p /tmp/dev-home && cd /source/client && echo installing npm deps && npm install --no-package-lock && echo starting vite server && vite --host' ]
      volumes:
        - './client/main:/source/client/main:ro'
        - './client/resultsview:/source/client/resultsview:ro'
        - './client/analysisui:/source/client/analysisui:ro'
        - './client/lib:/source/client/lib:ro'
        - './client/assets:/source/client/assets:ro'
        - './client/common:/source/client/common:ro'
        - './client/index.html:/source/client/index.html:ro'
        - './client/resultsview.html:/source/client/resultsview.html:ro'
        - './client/analysisui.html:/source/client/analysisui.html:ro'
        - './client/tsconfig.json:/source/client/tsconfig.json:ro'
        - './client/vite.config.mts:/source/client/vite.config.mts:ro'
        - './client/package.json:/source/client/package.json:ro'
        - './server/jamovi/server/jamovi.proto:/source/client/assets/coms.proto:ro'
      ports:
        - '127.0.0.1:5173:5173'
        - '127.0.0.1:24678:24678'

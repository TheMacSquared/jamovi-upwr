---
name: ttesttwo
title: Test t dla dwóch grup
jrs: '1.1'

items:
    - name: ttest
      title: Test t dla dwóch grup
      type: Table
      rows: 0
      clearWith: &cw
        - vars
        - group
        - hypothesis
        - welch
        - nonpar
        - ciWidth
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: test
          title: Test
          type: text
        - name: stat
          title: Statystyka
          type: number
        - name: df
          title: df
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: est
          title: Różnica średnich
          type: number
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności
        - name: es
          title: Wielkość efektu
          type: number
        - name: esLower
          title: Dolna
          type: number
          superTitle: CI efektu
        - name: esUpper
          title: Górna
          type: number
          superTitle: CI efektu

    - name: extra
      title: Dodatkowe testy i przedziały
      type: Table
      visible: (perm || boot || ks)
      rows: 0
      clearWith: *cw
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: test
          title: Test
          type: text
        - name: stat
          title: Statystyka
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności
        - name: note
          title: Uwagi
          type: text

    - name: desc
      title: Statystyki opisowe
      type: Table
      visible: (desc)
      rows: 0
      clearWith: *cw
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: group
          title: Grupa
          type: text
        - name: n
          title: n
          type: integer
        - name: mean
          title: Średnia
          type: number
        - name: median
          title: Mediana
          type: number
        - name: sd
          title: SD
          type: number
        - name: se
          title: SE
          type: number

    - name: norm
      title: Normalność (Shapiro-Wilk)
      type: Table
      visible: (norm)
      rows: 0
      clearWith: *cw
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: group
          title: Grupa
          type: text
        - name: w
          title: W
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: homog
      title: Jednorodność wariancji (Levene)
      type: Table
      visible: (homog)
      rows: 0
      clearWith: *cw
      columns:
        - name: var
          title: ""
          type: text
        - name: F
          title: F
          type: number
        - name: df1
          title: df1
          type: integer
        - name: df2
          title: df2
          type: integer
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: plots
      title: Wykresy
      type: Array
      visible: (plot)
      clearWith:
        - vars
        - group
        - ciWidth
        - plotType
      template:
        title: ''
        type: Image
        width: 520
        height: 400
        renderFun: .plot

    - name: qq
      title: Wykresy Q-Q
      type: Array
      visible: (qq)
      clearWith: *cw
      template:
        title: ''
        type: Image
        width: 380
        height: 340
        renderFun: .qq
...

---
name: ttestpaired
title: Test t dla prób sparowanych
menuGroup: T-Tests
menuTitle: Próby sparowane
menuSubtitle: dwa pomiary tej samej jednostki
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: pairs
      title: Pary zmiennych
      type: Pairs
      suggested:
        - continuous
      permitted:
        - numeric

    - name: hypothesis
      title: Hipoteza alternatywna
      type: List
      options:
        - title: Dwustronna (≠)
          name: different
        - title: Większa (>)
          name: greater
        - title: Mniejsza (<)
          name: less
      default: different

    - name: student
      title: t Studenta
      type: Bool
      default: true

    - name: nonpar
      title: Wilcoxona (rangowanych znaków)
      type: Bool
      default: false

    - name: plot
      title: Wykres pudełkowy z punktami
      type: Bool
      default: true

    - name: desc
      title: Statystyki opisowe
      type: Bool
      default: false

    - name: norm
      title: Normalność (Shapiro-Wilk)
      type: Bool
      default: false

    - name: qq
      title: Wykres Q-Q
      type: Bool
      default: false

    # --- opis metod (wspólny mechanizm jUPWR: jmvcore::metodyNew) ---
    - name: metody
      title: Opis zastosowanych metod
      type: Bool
      default: false
...

title: Test t dla jednej próby
name: ttestone
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienne
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Testy
            children:
              - type: CheckBox
                name: student
              - type: CheckBox
                name: nonpar
          - type: Label
            label: Hipoteza
            children:
              - type: TextBox
                name: testValue
                format: number
              - type: ComboBox
                name: hypothesis
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Dodatkowe statystyki
            children:
              - type: CheckBox
                name: desc
          - type: Label
            label: Wykres
            children:
              - type: CheckBox
                name: plot
          - type: Label
            label: Opis metod
            children:
              - type: CheckBox
                name: metody

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: Label
        label: Sprawdzenie założeń
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: CheckBox
                name: norm
              - type: CheckBox
                name: qq


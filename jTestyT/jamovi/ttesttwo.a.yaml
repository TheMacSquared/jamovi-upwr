---
name: ttesttwo
title: Test t dla dwóch grup
menuGroup: T-Tests
menuTitle: Dwie grupy
menuSubtitle: próby niezależne
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: vars
      title: Zmienne zależne
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group
      title: Zmienna grupująca
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: welch
      title: t Welcha (nierówne wariancje)
      type: Bool
      default: false

    - name: hypothesis
      title: Hipoteza alternatywna
      type: List
      options:
        - title: Dwustronna (≠)
          name: different
        - title: Większa (>)
          name: greater
        - title: Mniejsza (<)
          name: less
      default: different

    - name: student
      title: t Studenta
      type: Bool
      default: true

    - name: nonpar
      title: Manna-Whitneya U
      type: Bool
      default: false

    - name: plot
      title: Wykres pudełkowy z punktami
      type: Bool
      default: true

    - name: desc
      title: Statystyki opisowe
      type: Bool
      default: false

    - name: norm
      title: Normalność (Shapiro-Wilk)
      type: Bool
      default: false

    - name: qq
      title: Wykres Q-Q
      type: Bool
      default: false

    - name: homog
      title: Jednorodność wariancji (Levene)
      type: Bool
      default: false

    # --- opis metod (wspólny mechanizm jUPWR: jmvcore::metodyNew) ---
    - name: metody
      title: Opis zastosowanych metod
      type: Bool
      default: false
...

---
name: ttesttwo
title: Test t dla dwóch grup
menuGroup: T-Tests
menuTitle: Dwie grupy
menuSubtitle: próby niezależne
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: vars
      title: Zmienne zależne
      type: Variables
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group
      title: Zmienna grupująca
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: welch
      title: t Welcha (nierówne wariancje)
      type: Bool
      default: false

    - name: hypothesis
      title: Hipoteza alternatywna
      type: List
      options:
        - title: Dwustronna (≠)
          name: different
        - title: Większa (>)
          name: greater
        - title: Mniejsza (<)
          name: less
      default: different

    - name: student
      title: t Studenta
      type: Bool
      default: true

    - name: nonpar
      title: Manna-Whitneya U
      type: Bool
      default: false

    - name: plot
      title: Wykres grup i różnicy
      type: Bool
      default: true

    - name: plotType
      title: Rodzaj wykresu
      type: List
      options:
        - title: Estymacyjny (Gardner-Altman)
          name: est
        - title: Pudełkowy z punktami
          name: box
      default: est

    - name: ciWidth
      title: Poziom ufności
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: desc
      title: Statystyki opisowe
      type: Bool
      default: false

    - name: norm
      title: Normalność (Shapiro-Wilk)
      type: Bool
      default: false

    - name: qq
      title: Wykres Q-Q
      type: Bool
      default: false

    - name: homog
      title: Jednorodność wariancji (Levene)
      type: Bool
      default: false

...

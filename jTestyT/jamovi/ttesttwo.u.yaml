title: Test t dla dwóch grup
name: ttesttwo
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienne zależne
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
      - type: TargetLayoutBox
        label: Zmienna grupująca
        children:
          - type: VariablesListBox
            name: group
            isTarget: true
            maxItemCount: 1
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Testy
            children:
              - type: CheckBox
                name: student
              - type: CheckBox
                name: welch
              - type: CheckBox
                name: nonpar
              - type: CheckBox
                name: ks
          - type: Label
            label: Hipoteza
            children:

              - type: ComboBox
                name: hypothesis
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Dodatkowe statystyki
            children:
              - type: TextBox
                name: ciWidth
                format: number
                suffix: '%'
              - type: CheckBox
                name: desc
          - type: Label
            label: Wykres
            children:
              - type: CheckBox
                name: plot
              - type: ComboBox
                name: plotType
                enable: (plot)
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: Label
        label: Sprawdzenie założeń
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: CheckBox
                name: norm
              - type: CheckBox
                name: qq
              - type: CheckBox
                name: homog

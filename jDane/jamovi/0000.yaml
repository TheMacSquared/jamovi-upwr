---
title: Zbiory danych do zajęć (UPWr)
name: jDane
version: 0.5.0
jms: '1.0'
authors:
  - jUPWR Team
maintainer: jUPWR Team <maciej.karczewski@upwr.edu.pl>
description: >
  Zbiory danych wykorzystywane na zajęciach ze statystyki na Uniwersytecie
  Przyrodniczym we Wrocławiu. Moduł nie zawiera analiz.
analyses: []
datasets:
  - name: Wzrost roślin (PlantGrowth)
    path: PlantGrowth.csv
    description: "Sucha masa roślin: kontrola i 2 warunki uprawy — jednoczynnikowa ANOVA"
    tags:
      - rolnictwo
      - ANOVA
      - doświadczalnictwo
  - name: Nawożenie NPK (npk)
    path: npk.csv
    description: "Plon grochu przy nawożeniu N, P, K w 6 blokach (Fisher)"
    tags:
      - rolnictwo
      - ANOVA
      - doświadczalnictwo
  - name: Owies Yatesa — split-plot (oats)
    path: oats.csv
    description: "Plon owsa (Y), 3 odmiany (V) × 4 dawki N, 6 bloków (B) — split-plot"
    documentation:
      summary: >-
        Klasyczne doświadczenie polowe Yatesa (1935) z owsem w układzie
        split-plot: odmiany na dużych poletkach, dawki azotu na małych.
      details: >-
        Doświadczenie założono w 6 blokach. Każdy blok podzielono na 3 duże
        poletka, na których wysiano po jednej odmianie owsa; każde duże poletko
        podzielono na 4 małe poletka, na których zastosowano jedną z czterech
        dawek nawożenia azotem (0, 0,2, 0,4 i 0,6 cwt na akr). Łącznie 72
        obserwacje plonu. Zbiór jest wzorcowym przykładem układu zależnego
        (split-plot): czynnik „odmiana" testuje się wobec błędu dużych poletek
        (błąd a), a czynnik „azot" i interakcję wobec błędu małych poletek
        (błąd b). Analiza: Doświadczalnictwo → Split-plot (zależny), czynnik
        A = V, czynnik B = N, blok = B.
      variables:
        - name: B
          description: Blok (I–VI).
        - name: V
          description: >-
            Odmiana owsa (czynnik dużych poletek): Golden.rain, Marvellous,
            Victory.
        - name: N
          description: >-
            Dawka azotu w cwt na akr (czynnik małych poletek): 0.0cwt, 0.2cwt,
            0.4cwt, 0.6cwt.
        - name: Y
          description: Plon ziarna w ćwierćfuntach (1/4 lb) z małego poletka.
      source: Yates (1935), za dokumentacją pakietu MASS.
      references:
        - >-
          Yates, F. (1935). Complex experiments. Journal of the Royal
          Statistical Society Supplement, 2, 181–247.
        - >-
          Venables, W. N. i Ripley, B. D. (2002). Modern Applied Statistics
          with S, wyd. 4. New York: Springer.
      provenance:
        package: MASS
        dataset: oats
        url: https://search.r-project.org/CRAN/refmans/MASS/html/oats.html
      changes:
        - Dane wyeksportowane bez zmian (nazwy zmiennych jak w R).
    tags:
      - rolnictwo
      - ANOVA
      - doświadczalnictwo
  - name: Pszenica — kwadrat łaciński (syntetyczny)
    path: pszenica_latin.csv
    description: "Plon pszenicy (t/ha), 4 warianty nawożenia, kwadrat 4×4 (dane syntetyczne)"
    documentation:
      summary: >-
        Plon pszenicy ozimej w doświadczeniu nawozowym założonym jako kwadrat
        łaciński 4 × 4. Dane wygenerowane na potrzeby zajęć.
      details: >-
        Pole podzielono na 4 wiersze i 4 kolumny, czyli 16 poletek. Wiersze
        odpowiadają gradientowi wilgotności gleby, kolumny gradientowi
        nachylenia stoku. Każdy z czterech wariantów nawożenia występuje
        dokładnie raz w każdym wierszu i w każdej kolumnie, dzięki czemu oba
        kierunki zmienności pola są wyeliminowane z błędu. Dane wygenerowano
        z modelu addytywnego (efekt wiersza + efekt kolumny + efekt nawożenia +
        błąd losowy) z ustalonym ziarnem, więc plik jest odtwarzalny. Analiza:
        Doświadczalnictwo → Kwadrat łaciński, czynnik = nawoz, wiersz = wiersz,
        kolumna = kolumna.
      variables:
        - name: wiersz
          description: Numer wiersza pola (1–4), gradient wilgotności.
        - name: kolumna
          description: Numer kolumny pola (1–4), gradient nachylenia.
        - name: nawoz
          description: >-
            Wariant nawożenia: kontrola, NPK, obornik, NPK+obornik.
        - name: plon
          description: Plon ziarna w tonach z hektara.
      source: >-
        Dane syntetyczne zespołu jUPWR; skrypt generujący w jDane/data-raw/datasets.R.
      changes:
        - >-
          Zbiór wygenerowany, nie pochodzi z rzeczywistego doświadczenia;
          wartości zaokrąglono do dwóch miejsc po przecinku.
    tags:
      - rolnictwo
      - ANOVA
      - doświadczalnictwo
  - name: Uprawy ryżu (RiceFarms)
    path: RiceFarms.csv
    description: "171 gospodarstw ryżowych (Indonezja), 6 sezonów — nakłady, plony, ceny"
    tags:
      - rolnictwo
      - regresja
  - name: Zbiór danych Andersona (Irysy)
    path: iris.csv
    description: Zbiór danych "Iris" z R
    tags:
      - przyroda
      - statystyki opisowe
  - name: Pingwiny (Palmer)
    path: penguins.csv
    description: >-
      Pomiary 344 pingwinów trzech gatunków ze stacji Palmer na Antarktydzie
      (palmerpenguins)
    tags:
      - przyroda
      - statystyki opisowe
  - name: Wzrost zębów
    path: ToothGrowth.csv
    description: Niezbyt ciekawy zbiór danych do obliczania testu ANOVA
    tags:
      - medycyna
      - ANOVA
  - name: Masa urodzeniowa (birthwt)
    path: birthwt.csv
    description: >-
      189 noworodków — masa urodzeniowa i czynniki ryzyka niskiej masy; regresja
      logistyczna i tabele 2×2
    tags:
      - medycyna
      - regresja logistyczna
  - name: Wielka Piątka (Dolan, Oort, Stoel & Wicherts, 2009)
    path: Big5.csv
    description: Ciekawy zbiór danych do obliczania korelacji
    tags:
      - psychologia
      - korelacja
  - name: Błędy (Ryan, Wilde i Crist, 2013)
    path: bugs.csv
    description: Zbiór danych do obliczania testu ANOVA dla powtórzonych pomiarów
    tags:
      - psychologia
      - ANOVA
  - name: Kalifornijskie szkoły (CASchools)
    path: CASchools.csv
    description: >-
      Wyniki testów i charakterystyki 420 kalifornijskich okręgów szkolnych
      (Stock i Watson) — dane do regresji
    documentation:
      summary: >-
        Dane o wynikach testów, charakterystykach szkół i tle demograficznym
        uczniów w kalifornijskich okręgach szkolnych.
      details: >-
        Dane obejmują wszystkie 420 kalifornijskich okręgów K-6 i K-8, dla
        których były dostępne informacje z lat 1998 i 1999. Wyniki pochodzą ze
        standaryzowanego testu Stanford 9 przeprowadzanego w klasie piątej.
        Charakterystyki szkół i dane demograficzne są uśrednione na poziomie
        okręgu.
      variables:
        - name: district
          description: Kod okręgu szkolnego.
        - name: school
          description: Nazwa okręgu szkolnego.
        - name: county
          description: Hrabstwo.
        - name: grades
          description: Zakres klas prowadzonych w okręgu.
        - name: students
          description: Łączna liczba uczniów.
        - name: teachers
          description: Liczba nauczycieli w przeliczeniu na pełne etaty.
        - name: calworks
          description: >-
            Odsetek uczniów kwalifikujących się do programu pomocy dochodowej
            CalWorks.
        - name: lunch
          description: >-
            Odsetek uczniów kwalifikujących się do posiłków po obniżonej cenie.
        - name: computer
          description: Liczba komputerów.
        - name: expenditure
          description: Wydatki na jednego ucznia.
        - name: income
          description: Średni dochód w okręgu, w tysiącach USD.
        - name: english
          description: Odsetek uczniów uczących się języka angielskiego.
        - name: read
          description: Średni wynik testu z czytania.
        - name: math
          description: Średni wynik testu z matematyki.
      source: Materiały internetowe do Stocka i Watsona (2007).
      references:
        - >-
          Stock, J. H. i Watson, M. W. (2007). Introduction to Econometrics,
          wyd. 2. Boston: Addison Wesley.
      provenance:
        package: AER
        dataset: CASchools
        url: https://search.r-project.org/CRAN/refmans/AER/html/CASchools.html
      changes:
        - >-
          Wartości liczbowe zaokrąglono do czterech miejsc po przecinku, aby
          usunąć szum precyzji odziedziczony z pliku źródłowego Stata.
    tags:
      - społeczne
      - regresja
  - name: Romanse (Fair, 1978)
    path: affairs.csv
    description: >-
      601 respondentów ankiety Psychology Today — romanse pozamałżeńskie i cechy
      demograficzne
    tags:
      - społeczne
      - regresja
  - name: Titanic (pasażerowie)
    path: titanic.csv
    description: >-
      1309 pasażerów Titanica — przeżycie, płeć, wiek i klasa; tabele
      wielodzielcze i regresja logistyczna
    tags:
      - społeczne
      - regresja logistyczna
usesNative: true
minApp: 1.0.8

...

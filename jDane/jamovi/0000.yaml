---
title: Zbiory danych do zajęć (UPWr)
name: jDane
version: 0.3.0
jms: '1.0'
authors:
  - jUPWR Team
maintainer: jUPWR Team <maciej.karczewski@upwr.edu.pl>
description: >
  Zbiory danych wykorzystywane na zajęciach ze statystyki na Uniwersytecie
  Przyrodniczym we Wrocławiu. Moduł nie zawiera analiz.
analyses: []
datasets:
  - name: Wzrost roślin (PlantGrowth)
    path: PlantGrowth.csv
    description: >-
      Sucha masa roślin w grupie kontrolnej i dwóch warunkach uprawy —
      jednoczynnikowa ANOVA
    tags:
      - rolnictwo
      - ANOVA
  - name: Nawożenie NPK (npk)
    path: npk.csv
    description: >-
      Klasyczny eksperyment polowy Fishera — plon grochu przy nawożeniu N, P i K
      w sześciu blokach
    tags:
      - rolnictwo
      - ANOVA
  - name: Uprawy ryżu (RiceFarms)
    path: RiceFarms.csv
    description: >-
      Dane panelowe 171 indonezyjskich gospodarstw ryżowych z 6 sezonów —
      nakłady, plony i ceny
    tags:
      - rolnictwo
      - regresja
  - name: Zbiór danych Andersona (Irysy)
    path: iris.csv
    description: Zbiór danych "Iris" z R
    tags:
      - przyroda
      - statystyki opisowe
  - name: Pingwiny (Palmer)
    path: penguins.csv
    description: >-
      Pomiary 344 pingwinów trzech gatunków ze stacji Palmer na Antarktydzie
      (palmerpenguins)
    tags:
      - przyroda
      - statystyki opisowe
  - name: Wzrost zębów
    path: ToothGrowth.csv
    description: Niezbyt ciekawy zbiór danych do obliczania testu ANOVA
    tags:
      - medycyna
      - ANOVA
  - name: Masa urodzeniowa (birthwt)
    path: birthwt.csv
    description: >-
      189 noworodków — masa urodzeniowa i czynniki ryzyka niskiej masy; regresja
      logistyczna i tabele 2×2
    tags:
      - medycyna
      - regresja logistyczna
  - name: Wielka Piątka (Dolan, Oort, Stoel & Wicherts, 2009)
    path: Big5.csv
    description: Ciekawy zbiór danych do obliczania korelacji
    tags:
      - psychologia
      - korelacja
  - name: Błędy (Ryan, Wilde i Crist, 2013)
    path: bugs.csv
    description: Zbiór danych do obliczania testu ANOVA dla powtórzonych pomiarów
    tags:
      - psychologia
      - ANOVA
  - name: Kalifornijskie szkoły (CASchools)
    path: CASchools.csv
    description: >-
      Wyniki testów i charakterystyki 420 kalifornijskich okręgów szkolnych
      (Stock i Watson) — dane do regresji
    tags:
      - społeczne
      - regresja
  - name: Romanse (Fair, 1978)
    path: affairs.csv
    description: >-
      601 respondentów ankiety Psychology Today — romanse pozamałżeńskie i cechy
      demograficzne
    tags:
      - społeczne
      - regresja
  - name: Titanic (pasażerowie)
    path: titanic.csv
    description: >-
      1309 pasażerów Titanica — przeżycie, płeć, wiek i klasa; tabele
      wielodzielcze i regresja logistyczna
    tags:
      - społeczne
      - regresja logistyczna
usesNative: true
minApp: 1.0.8


        prawoskośne z wyraźnymi obserwacjami odstającymi — pojedyncze pozycje
        pokrywają dzienne zapotrzebowanie na sód albo kalorie. Zbiór ilustruje
        statystyki opisowe w grupach, wykresy pudełkowe i rozrzutu, ANOVA
        (kalorie wg restauracji), korelację (tłuszcz a kalorie) oraz regresję

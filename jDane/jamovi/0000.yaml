  - name: Ankieta TIPI — Wielka Piątka (heplots)
    path: TIPI.csv
    description: >-
      1799 osób z internetowej ankiety: pięć wymiarów osobowości (skala TIPI) i
      11 zmiennych demograficznych
    documentation:
      summary: >-
        Wyniki 1799 osób w pięciu wymiarach osobowości mierzonych krótkim
        kwestionariuszem TIPI oraz dane demograficzne (wykształcenie, miejsce
        zamieszkania, płeć, wiek i inne).
      details: >-
        Ankieta internetowa z ochotniczym udziałem, więc próba nie jest
        reprezentatywna. Każda skala (Extraversion, Neuroticism,
        Conscientiousness, Agreeableness, Openness) to średnia z dwóch pozycji
        (jednej kodowanej wprost i jednej odwrotnie), co ogranicza rzetelność
        pomiaru; wynik przyjmuje wartości od 1 do 7. Zbiór zawiera 1657 wierszy
        bez braków danych. Zmiany wprowadzone przez autorów pakietu przed
        włączeniem do jUPWR: usunięto 100 osób z odpowiedzią „Other” w zmiennej
        płci, a etykiety części poziomów (m.in. wykształcenia, języka
        ojczystego i rasy) skrócono. W zmiennej age występuje jedna wartość
        niemożliwa (5555). Zbiór ilustruje korelacje i macierz korelacji,
        porównania grup (płeć, język ojczysty, głosowanie), ANOVA, regresję
        wielokrotną i logistyczną oraz tabele częstości.
      variables:
        - name: Extraversion
          description: Ekstrawersja — średnia z dwóch pozycji, zakres 1–7.
        - name: Neuroticism
          description: Neurotyczność — średnia z dwóch pozycji, zakres 1–7.
        - name: Conscientiousness
          description: Sumienność — średnia z dwóch pozycji, zakres 1–7.
        - name: Agreeableness
          description: Ugodowość — średnia z dwóch pozycji, zakres 1–7.
        - name: Openness
          description: Otwartość na doświadczenia — średnia z dwóch pozycji, zakres 1–7.
        - name: education
          description: "Wykształcenie, od najniższego: <HS, HS, Univ, Grad."
        - name: urban
          description: "Miejsce zamieszkania, od wiejskiego: Rural, Suburban, Urban."
        - name: gender
          description: "Płeć: M, F."
        - name: engnat
          description: "Angielski jako język ojczysty: Native, Non-native."
        - name: age
          description: Wiek w latach.
        - name: religion
          description: Religia (12 kategorii, m.in. Agnostic, Atheist, Buddhist, Hindu, Jewish, Muslim, Sikh, Other).
        - name: orientation
          description: Orientacja (5 kategorii; Heterosexual, Bisexual, Homosexual, Asexual, Other).
        - name: race
          description: Rasa (5 kategorii; etykiety jak w źródle).
        - name: voted
          description: "Udział w głosowaniu: Yes, No."
        - name: married
          description: "Stan cywilny: Never married, Currently married, Previously married."
        - name: familysize
          description: Liczba (opis zmiennej nie jest podany w dokumentacji pakietu).
      source: >-
        Dane pierwotnie z Open Source Psychometrics Project
        (https://openpsychometrics.org/), w wersji z pakietu heplots użytej przez
        Jonesa i in. (2020).
      license:
        name: "GPL-2 | GPL-3"
        notice: "GPL-2 | GPL-3, za pakietami heplots 1.8.6 (GPL ≥ 2; Michael Friendly, John Fox, Georges Monette) i networktree 1.0.1 (GPL-2 | GPL-3; Payton Jones, Thorsten Simon, Achim Zeileis), z którego pochodzą surowe odpowiedzi na pozycje kwestionariusza. Wersja zbioru w jUPWR jest udostępniana na tej samej licencji."
        url: https://www.gnu.org/licenses/gpl-3.0.html
        texts:
          - GPL-2.0
          - GPL-3.0
      references:
        - >-
          Jones, P. J., Mair, P., Simon, T. i in. (2020). Network Trees: A Method
          for Recursively Partitioning Covariance Structures. Psychometrika, 85,
          926–945. https://doi.org/10.1007/s11336-020-09731-4
        - >-
          Gosling, S. D., Rentfrow, P. J. i Swann, W. B., Jr. (2003). A very brief
          measure of the Big-Five personality domains. Journal of Research in
          Personality, 37, 504–528.
      provenance:
        package: heplots
        version: "1.8.6"
        dataset: TIPI
        url: https://cran.r-project.org/package=heplots
        note: >-
          Surowe odpowiedzi na pozycje kwestionariusza: pakiet networktree 1.0.1
          (zbiór tipi); w nich pominięte pytanie ma kod 0.
        extraUrl: https://cran.r-project.org/package=networktree
        extraUrlLabel: Pakiet networktree
      changes:
        - >-
          W pakiecie heplots pominięte pytanie (kod 0 w surowych danych) weszło
          do średniej skali jako zero. Wyniki skal przeliczono z pozycji
          (X + (8 − X_r)) / 2, co odtwarza wartości z heplots, a tam, gdzie
          X lub X_r wynosiło 0, wstawiono brak danych. Zastąpiono 60 wartości
          (Extraversion 12, Neuroticism 12, Conscientiousness 13, Agreeableness
          11, Openness 12) u 20 osób. Pozostałe zmienne bez zmian; braki danych
          jako puste komórki.
      changesDate: '2026-10-11'
    tags:
      - psychologia
      - korelacja
  - name: Muzyka a zdrowie psychiczne (ankieta)
    path: mxmh.csv
    description: >-
      736 osób: nawyki słuchania muzyki, częstość słuchania 16 gatunków i
      samoocena lęku, depresji, bezsenności i objawów obsesyjno-kompulsyjnych
    documentation:
      summary: >-
        Ankieta o słuchaniu muzyki i samopoczuciu: 736 respondentów, czas i
        okoliczności słuchania, częstość słuchania 16 gatunków oraz samoocena
        czterech objawów w skali 0–10.
      details: >-
        Ankieta w formularzu internetowym, rozpowszechniana na forach,
        serwerach dyskusyjnych i w mediach społecznościowych, bez ograniczeń
        wieku i miejsca. Próba ochotnicza, niereprezentatywna. Lęk (anxiety),
        depresja (depression), bezsenność (insomnia) i objawy obsesyjno-
        kompulsyjne (ocd) to pojedyncze samooceny w skali 0–10, a nie wyniki
        narzędzi diagnostycznych. Częstość słuchania gatunków (kolumny freq_*)
        ma cztery poziomy, od najrzadszego: Never, Rarely, Sometimes, Very
        frequently. Zbiór ilustruje porównania grup, korelacje, tabele
        częstości i regresję. Przed włączeniem do jUPWR usunięto kolumny
        Timestamp i Permissions, zmieniono nazwy kolumn (tabela starych i
        nowych nazw: jDane/data-raw/mxmh_nazwy.csv) i zastąpiono brakiem
        danych 7 wartości bpm spoza zakresu 20–300.
      variables:
        - name: age
          description: Wiek w latach.
        - name: streaming_service
          description: Główny serwis streamingowy.
        - name: hours_per_day
          description: Średnia liczba godzin słuchania muzyki dziennie.
        - name: while_working
          description: Czy respondent słucha muzyki podczas pracy lub nauki (Yes, No).
        - name: instrumentalist
          description: Czy gra na instrumencie (Yes, No).
        - name: composer
          description: Czy komponuje (Yes, No).
        - name: fav_genre
          description: Ulubiony gatunek.
        - name: exploratory
          description: Czy aktywnie poszukuje nowych wykonawców i gatunków (Yes, No).
        - name: foreign_languages
          description: Czy regularnie słucha utworów w obcych językach (Yes, No).
        - name: bpm
          description: Tempo (uderzenia na minutę) ulubionego gatunku; wartości spoza zakresu 20–300 zastąpiono brakiem danych.
        - name: freq_classical
          description: "Częstość słuchania gatunku. Analogicznie: freq_country, freq_edm, freq_folk, freq_gospel, freq_hip_hop, freq_jazz, freq_k_pop, freq_latin, freq_lofi, freq_metal, freq_pop, freq_rnb, freq_rap, freq_rock, freq_video_game_music. Poziomy: Never, Rarely, Sometimes, Very frequently."
        - name: anxiety
          description: Samoocena lęku, skala 0–10.
        - name: depression
          description: Samoocena depresji, skala 0–10.
        - name: insomnia
          description: Samoocena bezsenności, skala 0–10.
        - name: ocd
          description: Samoocena objawów obsesyjno-kompulsyjnych, skala 0–10.
        - name: music_effects
          description: Ocena wpływu muzyki na zdrowie psychiczne (Improve, No effect, Worsen).
      source: >-
        Rasgaitis, C. (2022). Music & Mental Health Survey Results [zbiór
        danych]. Kaggle.
      license:
        name: "CC0 1.0"
        notice: "CC0 1.0, domena publiczna."
        url: https://creativecommons.org/publicdomain/zero/1.0/
        texts:
          - CC0-1.0
      references:
        - >-
          Rasgaitis, C. (2022). Music & Mental Health Survey Results [zbiór
          danych]. Kaggle. https://www.kaggle.com/datasets/catherinerasgaitis/mxmh-survey-results
      provenance:

  - name: Opóźnienia autobusów
    path: autobusy.csv
    description: >-
      500 kursów miejskich — opóźnienie w minutach wobec pory dnia, dnia
      tygodnia, pogody i długości trasy (zbiór syntetyczny)
    documentation:
      summary: >-
        Opóźnienia autobusów miejskich w zależności od pory dnia, dnia tygodnia,
        pogody i długości trasy — zbiór syntetyczny przygotowany na zajęcia.
      details: >-
        500 wylosowanych kursów czterech linii. Opóźnienia są mocno prawoskośne
        z dużą liczbą zer (kurs punktualny lub przed czasem), co pozwala pokazać,
        że średnia i mediana rozjeżdżają się, a założenie normalności bywa
        naciągane. Zbiór ilustruje dwuczynnikową ANOVA (pora dnia × pogoda),
        porównania wielokrotne, regresję z kowariantem (długość trasy) oraz
        testy nieparametryczne. Poziomy zmiennych porządkowych mają przedrostki
        liczbowe (1_rano, 2_wt), żeby układały się w naturalnej kolejności.
        Uwaga: dane są wygenerowane, nie pochodzą z pomiaru — nie należy z nich
        wyciągać wniosków o rzeczywistej komunikacji miejskiej. Analiza: ANOVA →
        ANOVA (zależna = opoznienie_min, czynniki = pora_dnia, pogoda).
      variables:
        - name: opoznienie_min
          description: Opóźnienie kursu w minutach (0 = punktualnie lub przed czasem).
        - name: pora_dnia
          description: "Pora dnia: 1_rano, 2_popoludnie, 3_wieczor."
        - name: dzien_tygodnia
          description: "Dzień tygodnia: od 1_pon do 7_nd."
        - name: pogoda
          description: "Warunki pogodowe: slonecznie, deszcz, snieg."
        - name: nr_linii
          description: Numer linii autobusowej (144, 175, 182, 501).
        - name: dlugosc_trasy_km
          description: Długość trasy w kilometrach.
      source: Zbiór syntetyczny, wygenerowany na potrzeby zajęć w jUPWR.
      license:
        name: "CC0 1.0"
        notice: "CC0 1.0, domena publiczna."
        url: https://creativecommons.org/publicdomain/zero/1.0/
        texts:
          - CC0-1.0
      provenance:
        package: jDane
        dataset: autobusy
      changes:
        - >-
          Ujemne zera powstałe przy zaokrąglaniu zamienione na 0; numery linii
          zapisane jako liczby całkowite.
      changesDate: '2026-09-03'
    tags:
      - społeczne
      - ANOVA
  - name: Fast food — wartości odżywcze

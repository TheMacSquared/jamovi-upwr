  Statystyka na danych satelitarnych i geoprzestrzennych: orbity satelitow
  (TLE/SGP4), mapy punktowe i statystyki regionalne, statystyki rastrow oraz
  prosta klasyfikacja pokrycia terenu. Na potrzeby kursu statystyki dla
  inzynierii danych satelitarnych i kosmicznych.
analyses:

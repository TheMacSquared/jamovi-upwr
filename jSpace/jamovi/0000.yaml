    menuSubgroup: Orbity
    category: analyses
  - title: Porownanie grup satelitow
    name: satgroups
    ns: jSpace
    menuGroup: Kosmos
    menuTitle: Porownanie grup satelitow
    menuSubgroup: Orbity
    category: analyses
  - title: Mapa punktowa i statystyki regionalne
    name: geomap
    ns: jSpace
    menuGroup: Kosmos
    menuTitle: Mapa punktowa i statystyki regionalne
    menuSubgroup: Dane przestrzenne
    category: analyses
  - title: Statystyki rastra (NDVI)
    name: rasterstats
    ns: jSpace
    menuGroup: Kosmos

title: Porownanie grup satelitow
name: satgroups
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienna
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Zmienna grupujaca
        children:
          - type: VariablesListBox
            name: group
            isTarget: true
            maxItemCount: 1
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Testy
            children:
              - type: CheckBox
                name: testAnova
                label: ANOVA (test F)
              - type: CheckBox
                name: testKruskal
                label: Kruskal-Wallis
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Wykres
            children:
              - type: CheckBox
                name: showPlot
                label: Wykres pudelkowy
              - type: CheckBox
                name: plotMeans
                label: Srednie na wykresie
                enable: (showPlot)

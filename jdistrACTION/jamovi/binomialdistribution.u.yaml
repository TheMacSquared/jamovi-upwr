title: Rozkład dwumianowy
name: BinomialDistribution
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: Label
    label: Parametry
    children:
      - type: TextBox
        name: dp1
        format: number
      - type: TextBox
        name: dp2
        format: number
        enable: (!empVar || empParams:given)
  - type: Label
    label: Funkcja
    children:
      - type: LayoutBox
        style: inline
        children:
          - type: LayoutBox
            margin: large
            cell:
              row: 1
              column: 1
            children:
              - type: CheckBox
                name: DistributionFunction
              - type: TextBox
                name: x1
                format: number
                enable: (DistributionFunction)
              - type: RadioButton
                name: DistributionFunctionType_is
                optionName: DistributionFunctionType
                optionPart: is
                enable: (DistributionFunction)
              - type: RadioButton
                name: DistributionFunctionType_lower
                optionName: DistributionFunctionType
                optionPart: lower
                enable: (DistributionFunction)
              - type: RadioButton
                name: DistributionFunctionType_higher
                optionName: DistributionFunctionType
                optionPart: higher
                enable: (DistributionFunction)
              - type: RadioButton
                name: DistributionFunctionType_interval
                optionName: DistributionFunctionType
                optionPart: interval
                enable: (DistributionFunction)
                children:
                  - type: TextBox
                    name: x2
                    format: number
                    enable: (DistributionFunction)
          - type: LayoutBox
            margin: large
            cell:
              row: 1
              column: 2
            children:
              - type: CheckBox
                name: QuantileFunction
              - type: TextBox
                name: p
                format: number
                enable: (QuantileFunction)
              - type: RadioButton
                name: QuantileFunctionType_cumulative
                optionName: QuantileFunctionType
                optionPart: cumulative
                enable: (QuantileFunction)
              - type: RadioButton
                name: QuantileFunctionType_central
                optionName: QuantileFunctionType
                optionPart: central
                enable: (QuantileFunction)
  - type: Label
    label: Momenty
    children:
      - type: CheckBox
        name: showMean
      - type: CheckBox
        name: showVariance
  - type: CollapseBox
    label: Dane empiryczne
    collapsed: true
    stretchFactor: 1
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Zmienna (liczba sukcesów w n próbach)
            children:
              - type: VariablesListBox
                name: empVar
                maxItemCount: 1
                isTarget: true
      - type: Label
        label: Model
        children:
          - type: RadioButton
            name: empParams_given
            optionName: empParams
            optionPart: given
            enable: (empVar)
          - type: RadioButton
            name: empParams_estimated
            optionName: empParams
            optionPart: estimated
            enable: (empVar)
      - type: Label
        label: Porównanie
        children:
          - type: CheckBox
            name: empBand
            enable: (empVar)
          - type: CheckBox
            name: empChiSq
            enable: (empVar)

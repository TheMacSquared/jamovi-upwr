---
name:  BinomialDistribution
title: Rozkład dwumianowy
jrs:   '1.1'

items:
    - name: Inputs
      title: Dane wejściowe
      type: Table
      rows: 2
      columns:
        - name: ParametersColumn
          title: Parametry
          type: text
        - name: DistributionFunctionColumn
          title: "'Oblicz prawdopodobieństwo'"
          type: text
          visible: (DistributionFunction)
        - name: QuantileFunctionColumn
          title: "'Oblicz kwantyl(e)'"
          type: text
          visible: (QuantileFunction)

    - name: Outputs
      title: "Wyniki"
      type: Table
      rows: 1
      columns:
        - name: DistributionResultColumn
          title: Prawdopodobieństwo
          type: text
          visible: (DistributionFunction)
        - name: QuantileResultColumn
          title: Kwantyl(e)
          type: text
          visible: (QuantileFunction)
        - name: EmpiricalResultColumn
          title: Częstość w danych
          type: text
          visible: (empVar)

    - name: MomentsTable
      title: Momenty
      type: Table
      rows: 0
      columns:
        - name: MomentColumn
          title: ""
          type: text
        - name: FormulaColumn
          title: Wzór
          type: text
        - name: ValueColumn
          title: Wartość
          type: text

    - name: EmpTable
      title: Liczności obserwowane i oczekiwane
      type: Table
      rows: 0
      visible: (empVar)
      columns:
        - name: x
          title: x
          type: text
        - name: obs
          title: Obserwowane
          type: integer
        - name: obsPct
          title: "% obs."
          type: number
          format: pc
        - name: exp
          title: Oczekiwane N·P
          type: number
        - name: diff
          title: Obs. − oczek.
          type: number
        - name: band
          title: Zakres 95%
          type: text
          visible: (empBand)

    - name: EmpMoments
      title: Momenty z danych i z modelu
      type: Table
      rows: 0
      visible: (empVar)
      columns:
        - name: stat
          title: ""
          type: text
        - name: data
          title: Dane
          type: number
        - name: model
          title: Model
          type: number

    - name: EmpChiSq
      title: Test zgodności χ²
      type: Table
      rows: 1
      visible: (empChiSq)
      columns:
        - name: chi
          title: χ²
          type: number
        - name: df
          title: df
          type: integer
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: classes
          title: Klasy
          type: integer

    - name: plot
      title: ""
      type:  Image
      width:  500
      height: 400
      renderFun: .plot
      refs: ggplot2
...
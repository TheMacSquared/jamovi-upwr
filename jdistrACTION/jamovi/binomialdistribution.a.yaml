---
name:  BinomialDistribution
title: Rozkład dwumianowy
menuGroup: Rozkłady
menuSubgroup: Rozkłady dyskretne
version: '1.1.0'
jas: '1.2'

options:
    - title: Oblicz prawdopodobieństwo
      name: DistributionFunction
      type: Bool
      default: FALSE


    - title: Oblicz kwantyl(e)
      name: QuantileFunction
      type: Bool
      default: FALSE


    - name: QuantileFunctionType
      title: Tryb kwantyli
      type: List
      options:
        - title: kwantyle przedziału centralnego
          name: central
        - title: kwantyl kumulatywny
          name: cumulative
      default: central


    - name: DistributionFunctionType
      title: Tryb dystrybuanty
      type: List
      options:
        - title: P(X ≤ x1)
          name:  lower
        - title: P(X ≥ x1)
          name:  higher
        - title: P(x1 ≤ X ≤ x2)
          name: interval
        - title: P(X = x1)
          name: is
      default: is

    - name: x1
      title: x1 =
      type: Number
      default: 0

    - name: p
      title: p =
      type: Number
      min: 0
      max: 1
      default: 0.5

    - name: x2
      title: x2 =
      type: Number
      default: 1

    - name: dp1
      title: n =
      type: Number
      default: 10

    - name: dp2
      title: Prawdopodb. =
      type: Number
      default: 0.5

    - title: Pokaż wartość oczekiwaną E[X]
      name: showMean
      type: Bool
      default: FALSE

    - title: Pokaż wariancję Var[X]
      name: showVariance
      type: Bool
      default: FALSE

    - name: data
      type: Data

    - name: empVar
      title: Dane empiryczne
      type: Variable
      suggested:
        - continuous
        - ordinal
        - nominal
      permitted:
        - numeric
        - factor
      default: null

    # counts: every row is X = number of successes in n trials;
    # binary: every row is one trial, the model drawn from the data is
    # Bin(n, p̂) with p̂ = share of successes and n from the parameters
    - name: empType
      title: Zmienna
      type: List
      options:
        - title: liczba sukcesów w n próbach
          name: counts
        - title: zero-jedynkowa (jedna próba w wierszu)
          name: binary
      default: counts

    - name: empLevel
      title: Kategoria „sukces”
      type: Level
      variable: (empVar)
...

---
name:  NegBinomialDistribution
title: Rozkład ujemny dwumianowy
menuGroup: Rozkłady
menuSubgroup: Rozkłady dyskretne
version: '1.3.0'
jas: '1.2'

options:
    - title: Oblicz prawdopodobieństwo
      name: DistributionFunction
      type: Bool
      default: FALSE

    - title: Oblicz kwantyl(e)
      name: QuantileFunction
      type: Bool
      default: FALSE

    - name: QuantileFunctionType
      title: Tryb kwantyli
      type: List
      options:
        - title: kwantyle przedziału centralnego
          name: central
        - title: kwantyl kumulatywny
          name: cumulative
      default: central

    - name: DistributionFunctionType
      title: Tryb dystrybuanty
      type: List
      options:
        - title: P(X ≤ x1)
          name:  lower
        - title: P(X ≥ x1)
          name:  higher
        - title: P(x1 ≤ X ≤ x2)
          name: interval
        - title: P(X = x1)
          name: is
      default: is

    - name: RandomVariable
      title: Zmienna losowa
      type: List
      options:
        - title: X = numer próby, w której pada r-ty sukces (X = r, r+1, …)
          name: trials
        - title: X = liczba porażek przed r-tym sukcesem (X = 0, 1, …)
          name: failures
      default: trials

    - name: x1
      title: x1 =
      type: Number
      default: 5

    - name: p
      title: p =
      type: Number
      default: 0.5
      min: 0
      max: 1

    - name: x2
      title: x2 =
      type: Number
      default: 7

    - name: dp1
      title: Liczba sukcesów (r) =
      type: Number
      default: 3
      min: 1

    - name: dp2
      title: Prawdopodobieństwo sukcesu (p) =
      type: Number
      default: 0.5
      min: 0.0001
      max: 1

    - title: Pokaż wartość oczekiwaną E[X]
      name: showMean
      type: Bool
      default: FALSE

    - title: Pokaż wariancję Var[X]
      name: showVariance
      type: Bool
      default: FALSE
...

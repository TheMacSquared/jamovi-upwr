---
name: anovarm
title: ANOVA powtórzonych pomiarów
jrs: '1.1'

items:
    - name: anova
      title: Analiza wariancji
      type: Table
      rows: 0
      clearWith: &cw
        - dep
        - subject
        - within
        - between
        - covs
        - ss
        - spherCorr
      columns:
        - name: source
          title: Efekt
          type: text
        - name: ss
          title: SS
          type: number
        - name: df1
          title: df
          type: number
        - name: df2
          title: df błędu
          type: number
        - name: mse
          title: MS błędu
          type: number
        - name: F
          title: F
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: ges
          title: η²G
          type: number
          format: zto
          visible: (ges)
        - name: pes
          title: η²p
          type: number
          format: zto
          visible: (pes)

    - name: spher
      title: Test sferyczności Mauchly'ego
      type: Table
      visible: (spherTests)
      rows: 0
      clearWith: *cw
      columns:
        - name: source
          title: Efekt
          type: text
        - name: W
          title: W Mauchly'ego
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: gg
          title: ε Greenhouse'a-Geissera
          type: number
        - name: hf
          title: ε Huynha-Feldta
          type: number

    - name: npTests
      title: Testy nieparametryczne
      type: Table
      visible: (friedman || page)
      rows: 0
      clearWith: *cw
      columns:
        - name: test
          title: Test
          type: text
        - name: stat
          title: Statystyka
          type: number
        - name: df
          title: df
          type: integer
        - name: z
          title: z
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue
        - name: es
          title: W Kendalla
          type: number
          format: zto

    - name: npMeans
      title: Mediany, średnie rang i grupy jednorodne
      type: Table
      visible: (friedman)
      rows: 0
      clearWith:
        - dep
        - subject
        - within
        - between
        - covs
        - alpha
        - npPostHoc
      columns:
        - name: level
          title: Poziom
          type: text
        - name: n
          title: n
          type: integer
        - name: median
          title: Mediana
          type: number
        - name: meanRank
          title: Średnia ranga
          type: number
        - name: letters
          title: Grupa
          type: text

    - name: npPairs
      title: Porównania parami (nieparametryczne)
      type: Table
      visible: (friedman && showPairs)
      rows: 0
      clearWith:
        - dep
        - subject
        - within
        - between
        - covs
        - alpha
        - npPostHoc
      columns:
        - name: g1
          title: Poziom 1
          type: text
        - name: g2
          title: Poziom 2
          type: text
        - name: diff
          title: Różnica średnich rang
          type: number
        - name: se
          title: SE
          type: number
        - name: stat
          title: Statystyka
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: art
      title: ART — ANOVA na wyrównanych rangach
      type: Table
      visible: (art)
      rows: 0
      clearWith: *cw
      columns:
        - name: source
          title: Efekt
          type: text
        - name: F
          title: F
          type: number
        - name: df1
          title: df
          type: number
        - name: df2
          title: df błędu
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: artMeans
      title: ART — średnie wyrównanych rang i grupy jednorodne
      type: Array
      visible: (art)
      clearWith:
        - dep
        - subject
        - within
        - between
        - covs
        - ss
        - alpha
        - postHoc
        - phWithin
        - phBetween
        - art
      template:
        title: ''
        type: Table
        rows: 0
        columns:
          - name: level
            title: Poziom
            type: text
          - name: mean
            title: Średnia ranga
            type: number
          - name: se
            title: SE
            type: number
          - name: letters
            title: Grupa
            type: text

    - name: artPairs
      title: ART — porównania parami
      type: Array
      visible: (art && showPairs)
      clearWith:
        - dep
        - subject
        - within
        - between
        - covs
        - ss
        - alpha
        - postHoc
        - phWithin
        - phBetween
        - art
      template:
        title: ''
        type: Table
        rows: 0
        columns:
          - name: g1
            title: Poziom 1
            type: text
          - name: g2
            title: Poziom 2
            type: text
          - name: diff
            title: Różnica rang
            type: number
          - name: se
            title: SE
            type: number
          - name: df
            title: df
            type: number
          - name: stat
            title: t
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue

    - name: means
      title: Średnie brzegowe i grupy jednorodne
      type: Array
      clearWith: &cwph
        - dep
        - subject
        - within
        - between
        - covs
        - ss
        - alpha
        - postHoc
        - phWithin
        - phBetween
        - phInter
      template:
        title: ''
        type: Table
        rows: 0
        columns:
          - name: level
            title: Poziom
            type: text
          - name: mean
            title: Średnia
            type: number
          - name: se
            title: SE
            type: number
          - name: lower
            title: Dolna
            type: number
            superTitle: Przedział ufności
          - name: upper
            title: Górna
            type: number
            superTitle: Przedział ufności
          - name: letters
            title: Grupa
            type: text

    - name: pairs
      title: Porównania parami
      type: Array
      visible: (showPairs)
      clearWith: *cwph
      template:
        title: ''
        type: Table
        rows: 0
        columns:
          - name: g1
            title: Poziom 1
            type: text
          - name: g2
            title: Poziom 2
            type: text
          - name: diff
            title: Różnica
            type: number
          - name: se
            title: SE
            type: number
          - name: df
            title: df
            type: number
          - name: stat
            title: t
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue
          - name: crit
            title: Różnica graniczna
            type: number
          - name: lower
            title: Dolna
            type: number
            superTitle: Przedział ufności
          - name: upper
            title: Górna
            type: number
            superTitle: Przedział ufności
          - name: d
            title: d Cohena
            type: number
            visible: (phES)

    - name: contrasts
      title: Kontrasty
      type: Array
      visible: (contrastType:deviation || contrastType:simple || contrastType:simpleLast || contrastType:difference || contrastType:helmert || contrastType:repeated || contrastType:polynomial)
      clearWith:
        - dep
        - subject
        - within
        - between
        - covs
        - ss
        - contrastType
      template:
        title: ''
        type: Table
        rows: 0
        columns:
          - name: contrast
            title: Kontrast
            type: text
          - name: estimate
            title: Oszacowanie
            type: number
          - name: se
            title: SE
            type: number
          - name: df
            title: df
            type: number
          - name: t
            title: t
            type: number
          - name: p
            title: p
            type: number
            format: zto,pvalue

    - name: desc
      title: Statystyki opisowe
      type: Table
      visible: (desc)
      rows: 0
      clearWith:
        - dep
        - within
        - between
      columns:
        - name: level
          title: Komórka
          type: text
        - name: n
          title: n
          type: integer
        - name: mean
          title: Średnia
          type: number
        - name: sd
          title: SD
          type: number
        - name: median
          title: Mediana
          type: number

    - name: homog
      title: Jednorodność wariancji
      type: Table
      visible: (homog)
      rows: 0
      clearWith: *cw
      columns:
        - name: test
          title: Test
          type: text
        - name: stat
          title: Statystyka
          type: number
        - name: df1
          title: df1
          type: integer
        - name: df2
          title: df2
          type: integer
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: norm
      title: Normalność reszt (Shapiro-Wilk)
      type: Table
      visible: (norm)
      rows: 1
      clearWith: *cw
      columns:
        - name: w
          title: W
          type: number
        - name: p
          title: p
          type: number
          format: zto,pvalue

    - name: plotMeans
      title: Wykresy średnich
      type: Array
      visible: (plotMeans)
      clearWith:
        - dep
        - subject
        - within
        - between
        - covs
        - ss
        - alpha
        - postHoc
        - phWithin
        - phBetween
        - phInter
        - errorBars
      template:
        title: ''
        type: Image
        width: 500
        height: 380
        renderFun: .meansPlot

    - name: plotInteraction
      title: Wykres interakcji
      type: Image
      visible: (plotInteraction)
      width: 500
      height: 380
      renderFun: .interactionPlot
      clearWith: *cw

    - name: qq
      title: Wykres Q-Q reszt
      type: Image
      visible: (qq)
      width: 400
      height: 350
      renderFun: .qqPlot
      clearWith: *cw

...

title: ANOVA powtórzonych pomiarów
name: anovarm
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienna zależna
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Jednostka (osoba, poletko)
        children:
          - type: VariablesListBox
            name: subject
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Czynniki wewnątrzobiektowe (powtarzane)
        children:
          - type: VariablesListBox
            name: within
            isTarget: true
      - type: TargetLayoutBox
        label: Czynniki międzyobiektowe
        children:
          - type: VariablesListBox
            name: between
            isTarget: true
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Test
            children:
              - type: ComboBox
                name: spherCorr
              - type: CheckBox
                name: nonpar
              - type: CheckBox
                name: pes
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Porównania
            children:
              - type: ComboBox
                name: postHoc
              - type: TextBox
                name: alpha
                format: number
              - type: CheckBox
                name: showPairs
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: Label
        label: Wykresy
        children:
          - type: LayoutBox
            style: inline
            children:
              - type: CheckBox
                name: plotMeans
              - type: CheckBox
                name: plotInteraction
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: Label
        label: Opis metod
        children:
          - type: CheckBox
            name: metody
  - type: CollapseBox
    label: Założenia
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: spherTests
              - type: CheckBox
                name: homog
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: CheckBox
                name: norm
              - type: CheckBox
                name: qq
  - type: CollapseBox
    label: Zaawansowane
    collapsed: true
    stretchFactor: 1
    children:
      - type: VariableSupplier
        persistentItems: false
        stretchFactor: 1
        children:
          - type: TargetLayoutBox
            label: Kowarianty
            children:
              - type: VariablesListBox
                name: covs
                isTarget: true
                height: small
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Model
                children:
                  - type: ComboBox
                    name: ss
                  - type: CheckBox
                    name: ges
              - type: Label
                label: Porównania
                children:
                  - type: CheckBox
                    name: phInter
                  - type: CheckBox
                    name: phES
                    enable: (showPairs)
                  - type: ComboBox
                    name: contrastType
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Tabele i wykresy
                children:
                  - type: CheckBox
                    name: desc
                  - type: ComboBox
                    name: errorBars
                    enable: (plotMeans)

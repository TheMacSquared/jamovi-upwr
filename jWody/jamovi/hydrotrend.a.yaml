---
name: hydrotrend
title: "Trendy i zmiany"
menuGroup: Hydrologia
version: 1.0.0
jas: "1.2"
weightsSupport: none
options:
  - name: data
    type: "Data"
  - name: date
    title: "Data (tekst ISO: RRRR-MM-DD)"
    type: "Variable"
    suggested:
      - nominal
    permitted:
      - factor
  - name: value
    title: "Wartość pomiaru"
    type: "Variable"
    suggested:
      - continuous
    permitted:
      - numeric
  - name: station
    default: null
    title: "Stacja / studnia (opcjonalnie)"
    type: "Variable"
    suggested:
      - nominal
    permitted:
      - factor
  - name: resolution
    title: "Rozdzielczość"
    type: "List"
    default: "daily"
    options:
      - name: daily
        title: "Dobowa"
      - name: monthly
        title: "Miesięczna (data = pierwszy dzień miesiąca)"
  - name: kind
    title: "Wielkość i jednostka"
    type: "List"
    default: "flow"
    options:
      - name: flow
        title: "Przepływ [m³/s]"
      - name: rain
        title: "Suma opadu [mm]"
      - name: stage
        title: "Stan wody [cm]"
      - name: depth
        title: "Głębokość zwierciadła [m p.p.t.]"
      - name: level
        title: "Rzędna zwierciadła [m n.p.m.]"
  - name: yearStart
    title: "Pierwszy miesiąc roku hydrologicznego"
    type: "Integer"
    default: 11
    min: 1
    max: 12
  - name: dateStart
    title: "Początek okresu (RRRR-MM-DD; puste = cały)"
    type: "String"
    default: ""
  - name: dateEnd
    title: "Koniec okresu (RRRR-MM-DD; puste = cały)"
    type: "String"
    default: ""
  - name: completeness
    title: "Minimalna kompletność okresu [%]"
    type: "Number"
    default: 100
    min: 1
    max: 100
  - name: trendMode
    title: "Szereg do analizy trendu"
    type: "List"
    default: "annual"
    options:
      - name: annual
        title: "Agregaty roczne — Mann–Kendall i Sen"
      - name: seasonal
        title: "Agregaty miesięczne — sezonowy MK i Sen"
  - name: inferIndependent
    title: "Pokaż p i PU przy założeniu niezależności (bez korekty autokorelacji)"
    type: "Bool"
    default: false
  - name: pettitt
    title: "Test Pettitta (tylko agregaty roczne)"
    type: "Bool"
    default: false
  - name: showPlot
    title: "Pokaż wykresy"
    type: "Bool"
    default: false
  - name: metody
    title: "Opis zastosowanych metod"
    type: "Bool"
    default: false
...

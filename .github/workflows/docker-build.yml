name: Docker build

# Docker jest referencyjnym, powtarzalnym buildem jUPWR (patrz CLAUDE.md).
# Buildy natywne (Windows/macOS) wymagają runnerów z pełnym toolchainem R
# i nie są tu weryfikowane — ta bramka ma łapać to, co psuje obraz dla
# wszystkich platform naraz (np. rozjazd wersji R modułów, który potrafi
# unieważnić wszystkie moduły i zostawić pustą wstążkę Analiz).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Spójność wydania
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # skrypt zgłasza brak .jmo dla platformy hosta (budowane na Win/macOS),
      # więc na CI sprawdzamy tylko spójność wersji i metadanych
      - name: release-check.sh
        run: bash packaging/scripts/release-check.sh || true
      - name: Wersje modułów (0000.yaml = DESCRIPTION)
        run: |
          fail=0
          for d in */jamovi/0000.yaml; do
            m="${d%%/*}"
            [ -f "$m/DESCRIPTION" ] || continue
            vy="$(grep -m1 -oE '^version: *[0-9.]+' "$d" | grep -oE '[0-9.]+')"
            vd="$(grep -m1 '^Version:' "$m/DESCRIPTION" | grep -oE '[0-9.]+')"
            if [ "$vy" != "$vd" ]; then
              echo "::error file=$d::$m: 0000.yaml=$vy != DESCRIPTION=$vd (jmc użyje $vy)"
              fail=1
            fi
          done
          exit $fail

  docker:
    name: Obraz Docker
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build obrazu jUPWR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/jamovi-Dockerfile
          push: false
          load: true
          tags: jupwr/jupwr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bug, który to łapie: gdy JAMOVI_R_VERSION nie zgadza się z wersją
      # stemplowaną przez jmc w metadanych modułu, serwer uznaje każdy moduł
      # za niezgodny i wstążka Analiz jest pusta. Obraz buduje się wtedy
      # poprawnie, więc sam build tego nie wykryje.
      - name: Moduły są zgodne z wersją R obrazu
        run: |
          docker run --rm --entrypoint /bin/bash jupwr/jupwr:ci -c '
            set -e
            env_r=$(grep -oP "(?<=^JAMOVI_R_VERSION=).*" /usr/lib/jamovi/bin/env.conf)
            echo "env.conf JAMOVI_R_VERSION=$env_r"
            fail=0
            for f in /usr/lib/jamovi/modules/*/jamovi.yaml; do
              m=$(basename "$(dirname "$f")")
              mod_r=$(grep -oP "(?<=^rVersion: ).*" "$f" | tr -d "\"'"'"'" )
              [ -z "$mod_r" ] && continue
              if [ "$mod_r" != "$env_r" ]; then
                echo "NIEZGODNY: $m rVersion=$mod_r != $env_r"
                fail=1
              else
                echo "ok: $m ($mod_r)"
              fi
            done
            exit $fail'

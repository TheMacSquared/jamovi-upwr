name: Spójność wydania

# Celowo NIE budujemy tu obrazu Dockera. Build i tak jest uruchamiany lokalnie
# przed każdym wydaniem (jest wtedy szybszy — ciepły cache warstw), więc na CI
# tylko dublowałby tę pracę. CI sprawdza metadane, kompiluje zmieniane
# moduły statystyczne w katalogu tymczasowym i uruchamia ich testy R, a także
# uruchamia testy klienta (vitest) i serwera (pytest na serwerze zbudowanym
# z kopii źródeł, bez obrazu; testy wymagające silnika R same się pomijają).

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

# ubuntu-24.04 przypięte, nie ubuntu-latest: binaria RSPM dla setup-r są budowane
# pod konkretne wydanie Ubuntu; zmiana systemu runnera ma być osobnym commitem
jobs:
  check:
    name: Wersje i metadane
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # submodules: recursive — plots/jmv wnoszą własne 0000.yaml i DESCRIPTION
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jamovi-compiler/package-lock.json
      # js-yaml dla kontroli licencji jDane w release-check.sh
      - name: Zależności kompilatora
        run: npm ci --prefix jamovi-compiler

      - name: Spójność metadanych (obowiązkowa)
        run: bash packaging/scripts/release-check.sh --metadata-only
      - name: Testy kontroli wydania
        run: python3 -m unittest discover -s packaging/tests -p 'test_*.py'

  statistics:
    name: Testy obliczeń i analiz R
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: '4.6.0'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jamovi-compiler/package-lock.json
      - name: Zależności kompilatora
        run: npm ci --prefix jamovi-compiler
      - name: Protobuf dla testów odtwarzania wyników
        run: sudo apt-get update && sudo apt-get install -y libprotobuf-dev protobuf-compiler
      - name: Zależności R
        shell: Rscript {0}
        run: |
          install.packages(c("testthat", "R6", "rlang", "jsonlite", "base64enc", "car", "ggplot2", "boot", "lpSolve", "nortest", "RProtoBuf", "ggridges", "hexbin", "dplyr", "scales"))
          # jANOVA and jRISK runtime, then the reference packages their tests
          # compare against (welchADF has no CRAN release for this R; that
          # single comparison skips itself)
          install.packages(c("afex", "emmeans", "mvtnorm", "survival", "multcomp", "ARTool", "rstatix"))
      - name: Kompilacja i testy modułów statystycznych
        run: bash packaging/scripts/test-statistics.sh

  client:
    name: Testy klienta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Zależności klienta
        run: npm ci --prefix client --no-audit --no-fund
      - name: Testy klienta (vitest)
        run: npm test --prefix client -- run

  server:
    name: Testy serwera
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # submodules: recursive — serwer buduje się razem z readstat
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Biblioteki do budowy serwera
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3-dev python3-venv protobuf-compiler libprotobuf-dev libboost-filesystem-dev libboost-system-dev libnanomsg-dev
      - name: Budowa i testy serwera (pytest)
        run: bash packaging/scripts/test-server.sh

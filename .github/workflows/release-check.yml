name: Spójność wydania

# Celowo NIE budujemy tu obrazu Dockera. Build i tak jest uruchamiany lokalnie
# przed każdym wydaniem (jest wtedy szybszy — ciepły cache warstw), więc na CI
# tylko dublowałby tę pracę. CI sprawdza metadane oraz kompiluje zmieniane
# moduły statystyczne w katalogu tymczasowym i uruchamia ich testy R.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Wersje i metadane
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # submodules: recursive — plots/jmv wnoszą własne 0000.yaml i DESCRIPTION
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Spójność metadanych (obowiązkowa)
        run: bash packaging/scripts/release-check.sh --metadata-only
      - name: Testy kontroli wydania
        run: python3 -m unittest discover -s packaging/tests -p 'test_*.py'

  statistics:
    name: Testy obliczeń i analiz R
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          r-version: '4.6.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jamovi-compiler/package-lock.json
      - name: Zależności kompilatora
        run: npm ci --prefix jamovi-compiler
      - name: Zależności R
        shell: Rscript {0}
        run: |
          install.packages(c("testthat", "R6", "rlang", "jsonlite", "base64enc", "car", "ggplot2", "boot", "lpSolve"))
      - name: Kompilacja i testy jperm, jCI, jRegr
        run: bash packaging/scripts/test-statistics.sh

<!DOCTYPE html>
<html aria-label="jUPWR">
<head>
    <meta charset="utf-8" />
    <title>jUPWR</title>
    <link href="main/main.css" type="text/css" rel="stylesheet">
    <script>
        if (window.customElements === undefined)
            window.location.href = "https://www.jamovi.org/misc/unsupported.html";
    </script>
    <!-- jUPWR: loading screen, styled here so it shows before the app CSS
         and JS load; hidden by main/jupwrsplash.ts -->
    <style>
        #jupwr-splash {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            background: #fff;
            color: #832034;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: opacity 0.35s ease;
            -webkit-app-region: drag;
            user-select: none;
        }
        #jupwr-splash.done {
            opacity: 0;
            pointer-events: none;
        }
        #jupwr-splash img {
            width: min(420px, 70vw);
            height: auto;
        }
        #jupwr-splash .jupwr-splash-text {
            font-size: 15px;
        }
        #jupwr-splash .jupwr-splash-version {
            font-size: 12px;
            color: #999;
            min-height: 1em;
        }
        #jupwr-splash .jupwr-splash-bar {
            position: relative;
            width: 160px;
            height: 3px;
            overflow: hidden;
            border-radius: 2px;
            background: #ece0e3;
        }
        #jupwr-splash .jupwr-splash-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: #832034;
            animation: jupwr-splash-slide 1.2s ease-in-out infinite;
        }
        @keyframes jupwr-splash-slide {
            to { left: 100%; }
        }
    </style>
    <script src="/config.js" type="text/javascript"></script>
    <script src="main/main.ts" type="module"></script>
</head>

<body role="application" data-table-mode="spreadsheet" data-splitpanel-mode="mixed" accessible="false" focusMode="default" id="main-window">
    <div id="jupwr-splash" role="status" aria-label="Uruchamianie jUPWR">
        <img src="./assets/upwr-logotyp-pl-poziomy.png" alt="Uniwersytet Przyrodniczy we Wrocławiu">
        <div class="jupwr-splash-text">uruchamianie jUPWR…</div>
        <div class="jupwr-splash-bar"></div>
        <div class="jupwr-splash-version"></div>
    </div>

    <!--<div id="backstage" role="menu" aria-label="File" aria-orientation="vertical"></div>-->

    <div id="main" role="presentation">
        <div id="header" aria-hidden="true">
            <div id="header-text" class="app-dragable">jUPWR<span class="header-file-name"></span></div>
            <div id="header-buttons" dir="ltr">
                <div id="min-button" class="header-button">
                    <div class="header-button-icon"></div>
                </div>
                <div id="max-button" class="header-button">
                    <div class="header-button-icon"></div>
                </div>
                <div id="close-button" class="header-button">
                    <div class="header-button-icon"></div>
                </div>
            </div>
        </div>

        <div class="silky-ribbon" role="toolbar" aria-label="Ribbon" aria-orientation="horizontal">
        </div>

        <jmv-splitpanel id="main-view" role="main" aria-label="Workspace">
            <jmv-variable-editor id="variable-editor" class="hidden jmv-variable-editor" role="menu" aria-label="variable editor">
            </jmv-variable-editor>
        </jmv-splitpanel>
    </div>

    <div id="progress-bar">
    </div>

    <div id="notifications">
    </div>

</body>

</html>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="44" width="74" viewBox="0 0 74 44" overflow="hidden">
  <!-- jboot module icon: resampling with replacement building a distribution -->
  <!-- original sample -->
  <g fill="#832034">
    <circle cx="9"  cy="10" r="3.5"/>
    <circle cx="19" cy="7"  r="3.5"/>
    <circle cx="14" cy="18" r="3.5"/>
  </g>
  <!-- resample: one value drawn twice (accent) -->
  <g fill="#B05263">
    <circle cx="9"  cy="34" r="3.5"/>
    <circle cx="19" cy="37" r="3.5"/>
  </g>
  <circle cx="14" cy="26" r="3.5" fill="#D99A5B"/>
  <circle cx="23" cy="29" r="3.5" fill="#D99A5B"/>
  <!-- resampling loop arrow -->
  <path stroke="#9F9F9F" stroke-width="1.5" fill="none" d="m28 10c6 0 6 12 0 14"/>
  <path fill="#9F9F9F" d="m30 22l-4 2 4 2z"/>
  <!-- bootstrap distribution -->
  <g fill="#E9C6CD" stroke="#B05263" stroke-width="1">
    <rect x="40" y="34" width="7" height="8"/>
    <rect x="48" y="20" width="7" height="22"/>
    <rect x="56" y="12" width="7" height="30"/>
    <rect x="64" y="26" width="7" height="16"/>
  </g>
  <path stroke="#832034" stroke-width="2" d="m38 42h34" fill="none"/>
</svg>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="44" width="74" viewBox="0 0 74 44" overflow="hidden">
  <!-- jSpace module icon: planet with an orbiting satellite, burgundy/gold -->
  <!-- stars -->
  <g fill="#E9C6CD">
    <circle cx="12" cy="7" r="1.5"/>
    <circle cx="64" cy="5" r="1.2"/>
    <circle cx="68" cy="38" r="1.5"/>
    <circle cx="7" cy="38" r="1.2"/>
  </g>
  <!-- full orbit (drawn behind the planet) -->
  <ellipse cx="37" cy="22" rx="30" ry="11" transform="rotate(-16 37 22)"
           stroke="#B05263" stroke-width="2" fill="none"/>
  <!-- planet -->
  <circle cx="37" cy="22" r="9.5" fill="#B05263" stroke="#832034" stroke-width="2"/>
  <!-- planet meridian hint -->
  <path stroke="#E9C6CD" stroke-width="1.5" fill="none" d="M 33.5 13.6 a 12 12 0 0 0 0 16.8"/>
  <!-- front section of the same orbit, overlaid via dash on an identical
       ellipse (pathLength 100; the ellipse path starts at its right vertex
       and runs clockwise, so units 0-50 are the near/bottom half) -->
  <ellipse cx="37" cy="22" rx="30" ry="11" transform="rotate(-16 37 22)"
           stroke="#832034" stroke-width="2.5" fill="none" stroke-linecap="round"
           pathLength="100" stroke-dasharray="44 56" stroke-dashoffset="-3"/>
  <!-- satellite on the front arc (ellipse angle 65deg) -->
  <circle cx="51.9" cy="28.1" r="3.5" fill="#D99A5B" stroke="#832034" stroke-width="1.5"/>
</svg>

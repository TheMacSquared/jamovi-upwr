<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" height="44" width="74" viewBox="0 0 74 44" overflow="hidden">
  <!-- jPomiar module icon: repeated measurements scattered around a mean, with an uncertainty bar -->
  <!-- axes -->
  <path stroke="#9F9F9F" stroke-width="1.5" d="m8 2v40h64" fill="none"/>
  <!-- mean -->
  <path stroke="#9F9F9F" stroke-width="1.5" stroke-dasharray="5 3" d="m10 22h60" fill="none"/>
  <!-- individual measurements -->
  <g fill="#832034">
    <circle cx="17" cy="13" r="3.2"/>
    <circle cx="27" cy="31" r="3.2"/>
    <circle cx="37" cy="17" r="3.2"/>
    <circle cx="47" cy="29" r="3.2"/>
  </g>
  <!-- combined uncertainty of the mean -->
  <g stroke="#D99A5B" stroke-width="2.5" fill="none">
    <path d="m61 8v28m-6-28h12m-12 28h12"/>
  </g>
  <circle cx="61" cy="22" r="4" fill="#D99A5B"/>
</svg>

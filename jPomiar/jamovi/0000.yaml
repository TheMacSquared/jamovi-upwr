datasets:
  - name: Azotany w roztworze wzorcowym (syntetyczne)
    path: azotany.csv
    description: >-
      20 powtórzonych oznaczeń azotanów w certyfikowanym roztworze wzorcowym o
      wartości 50,00 mg/L (inżynieria środowiska).
    documentation:
      summary: >-
        Laboratorium oczyszczalni sprawdza metodę spektrofotometryczną na
        wzorcu, zanim wykona serię oznaczeń w ściekach oczyszczonych. Zbiór
        służy do porównania rozrzutu pojedynczego oznaczenia z niepewnością
        średniej i do zbudowania pełnego budżetu niepewności.
      details: >-
        W Pomiary → Powtarzane pomiary wybierz stezenie_mgL i odniesienie 50
        mg/L. Oczekiwane: średnia 50,1315 mg/L, SD około 0,115361 mg/L, u_A
        około 0,025796 mg/L. Średnia leży powyżej wartości certyfikowanej — to
        obciążenie metody, nie przypadek. W Budżecie niepewności wpisz tę
        średnią, poprawkę −0,150 mg/L (obciążenie ze świadectwa), u_A,
        wzorcowanie U = 0,250 mg/L przy k = 2 oraz rozdzielczość d = 0,010 mg/L.
        Wynik: 49,9815 mg/L, u_c około 0,127667 mg/L, U około 0,255 mg/L przy k
        = 2. Zwróć uwagę, że wzorcowanie odpowiada za około 96% wariancji —
        zwiększanie liczby powtórzeń nie poprawi wyniku, bo zmniejsza tylko u_A.
        Dalej w Propagacji niepewności policz ładunek azotanów odprowadzany do
        odbiornika: iloczyn stężenia (49,98 mg/L, u = 0,128) i przepływu (1450
        m³/d, u = 35 m³/d); wielkości są niezależne, więc korelację zostaw
        wyłączoną.
      variables:
        - name: pomiar
          description: Kolejność oznaczenia (1–20).
        - name: stezenie_mgL
          description: Stężenie azotanów w miligramach na litr.
      source: >-
        Dane syntetyczne zespołu jUPWR do ćwiczeń, nie rzeczywiste wyniki
        laboratorium.
    tags:
      - pomiary
      - niepewność
      - inżynieria środowiska
  - name: Lokalizacja poszkodowanego (syntetyczne)
    path: lokalizacja.csv
    description: >-
      30 kolejnych wyznaczeń pozycji nieruchomego poszkodowanego przez
      lokalizator GNSS podczas akcji ratowniczej (inżynieria bezpieczeństwa).
    documentation:
      summary: >-
        Elipsa rozrzutu jako obszar przeszukania: kowariancja składowych, osie
        główne i niepewność średniego położenia.
      details: >-
        Wybierz Pomiary → Kowariancja i elipsa 2D, X = wschod_m, Y = polnoc_m.
        Włącz wykres i osie główne. Oczekiwane: średnia (5,79 ; −3,31) m, SD
        3,85 m na wschód i 2,18 m na północ, współczynnik korelacji około 0,37.
        Osie główne mają około 3,96 m i 1,97 m, więc elipsa jest wyraźnie
        wydłużona i pochylona — składowe nie są niezależne, bo zależą od tej
        samej geometrii satelitów. Oś główna wskazuje kierunek najgorszej
        dokładności. Porównaj elipsę standardową i przybliżony rozrzut 95% z
        obszarem ufności średniego położenia 95%. Pierwsza mówi, gdzie trafi
        następne wyznaczenie, druga — jak dobrze znamy pozycję po 30 odczytach.
        Operacyjnie pierwsza wyznacza obszar, który trzeba przeszukać.
        Współrzędne to odchyłki w metrach od punktu odniesienia przyjętego przez
        kierującego akcją; obie mają tę samą jednostkę.
      variables:
        - name: wschod_m
          description: Odchyłka na wschód od punktu odniesienia, w metrach.
        - name: polnoc_m
          description: Odchyłka na północ od punktu odniesienia, w metrach.
      source: Dane syntetyczne zespołu jUPWR, nie rzeczywiste zapisy GNSS.
    tags:
      - pomiary
      - kowariancja
      - elipsa
      - inżynieria bezpieczeństwa
usesNative: true
minApp: 1.0.8


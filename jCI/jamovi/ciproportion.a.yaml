---
name: ciproportion
title: Przedział ufności dla proporcji
menuGroup: Przedziały ufności
menuSubgroup: Proporcje
menuTitle: Proporcja
menuSubtitle: udział jednej kategorii
version: '2.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: dep
      title: Zmienna
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: level
      title: Kategoria „sukces”
      type: Level
      variable: (dep)

    - name: ciWidth
      title: Poziom ufności
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: ciMethod
      title: Metoda przedziału
      type: List
      options:
        - title: Wilsona (score)
          name: wilson
        - title: Cloppera-Pearsona (dokładna)
          name: clopperPearson
        - title: Walda
          name: wald
        - title: Bootstrap percentylowy
          name: perc
        - title: Bootstrap BCa
          name: bca
      default: wilson

    - name: plot
      title: Wykres
      type: Bool
      default: true

    # --- zaawansowane: bootstrap ---
    - name: nBoot
      title: Liczba losowań B
      type: Integer
      default: 1000
      min: 100
      max: 100000

    - name: seed
      title: Ziarno generatora (0 = bez ustawiania)
      type: Integer
      default: 0
      min: 0

    - name: bootPlot
      title: Histogram rozkładu bootstrapowego
      type: Bool
      default: false

    # --- opis metod (wspólny mechanizm jUPWR: jmvcore::metodyNew) ---
    - name: metody
      title: Opis zastosowanych metod
      type: Bool
      default: false

...

---
name: ciregression
title: Przedział ufności dla współczynników regresji
menuGroup: Przedziały ufności
menuSubgroup: Korelacja i regresja
menuTitle: Regresja liniowa
menuSubtitle: wyraz wolny i nachylenie
version: '2.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: dep
      title: Zmienna zależna (Y)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric

    - name: pred
      title: Predyktor (X)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric

    - name: ciWidth
      title: Poziom ufności
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: ciMethod
      title: Metoda przedziału
      type: List
      options:
        - title: t-Studenta (lm)
          name: t
        - title: Bootstrap percentylowy
          name: perc
        - title: Bootstrap BCa
          name: bca
      default: t

    - name: plot
      title: Wykres
      type: Bool
      default: true

    # --- zaawansowane: bootstrap ---
    - name: nBoot
      title: Liczba losowań B
      type: Integer
      default: 1000
      min: 100
      max: 100000

    - name: seed
      title: Ziarno generatora (0 = bez ustawiania)
      type: Integer
      default: 0
      min: 0

    - name: bootPlot
      title: Histogram rozkładu bootstrapowego
      type: Bool
      default: false

    # --- opis metod (wspólny mechanizm jUPWR: jmvcore::metodyNew) ---
    - name: metody
      title: Opis zastosowanych metod
      type: Bool
      default: false

...

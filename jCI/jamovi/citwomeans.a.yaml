---
name: citwomeans
title: Przedział ufności dla różnicy średnich
menuGroup: Przedziały ufności
menuSubgroup: Średnie
menuTitle: Różnica średnich
menuSubtitle: dwie grupy niezależne
version: '2.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: dep
      title: Zmienna
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric

    - name: group
      title: Zmienna grupująca
      type: Variable
      suggested:
        - nominal
        - ordinal
      permitted:
        - factor

    - name: level1
      title: Grupa 1
      type: Level
      variable: (group)

    - name: level2
      title: Grupa 2
      type: Level
      variable: (group)

    - name: ciWidth
      title: Poziom ufności
      type: Number
      min: 50
      max: 99.9
      default: 95

    - name: ciMethod
      title: Metoda przedziału
      type: List
      options:
        - title: Welcha (t, nierówne wariancje)
          name: welch
        - title: t-Studenta (wspólna wariancja)
          name: student
        - title: Bootstrap percentylowy
          name: perc
        - title: Bootstrap BCa
          name: bca
      default: welch

    - name: plot
      title: Wykres
      type: Bool
      default: true

    - name: effSize
      title: d Cohena z przedziałem ufności
      type: Bool
      default: false

    # --- zaawansowane: bootstrap ---
    - name: nBoot
      title: Liczba losowań B
      type: Integer
      default: 1000
      min: 100
      max: 100000

    - name: seed
      title: Ziarno generatora (0 = bez ustawiania)
      type: Integer
      default: 0
      min: 0

    - name: bootPlot
      title: Histogram rozkładu bootstrapowego
      type: Bool
      default: false

    # --- opis metod (wspólny mechanizm jUPWR: jmvcore::metodyNew) ---
    - name: metody
      title: Opis zastosowanych metod
      type: Bool
      default: false

...

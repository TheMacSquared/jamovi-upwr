---
name: cipairedmeans
title: Przedział ufności dla średniej różnic
jrs: '1.1'

items:
    - name: table
      title: Przedział ufności dla średniej różnic
      type: Table
      rows: 1
      clearWith: &cw
        - var1
        - var2
        - ciWidth
        - ciMethod
        - nBoot
        - seed
      columns:
        - name: var1
          title: Pomiar 1
          type: text
        - name: var2
          title: Pomiar 2
          type: text
        - name: n
          title: n
          type: integer
        - name: estimate
          title: Średnia różnic
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności

    - name: plot
      title: ''
      type: Image
      visible: (plot)
      width: 520
      height: 400
      renderFun: .ciPlot
      clearWith: *cw

    - name: bootPlot
      title: Rozkład bootstrapowy
      type: Image
      visible: (bootPlot && (ciMethod:perc || ciMethod:bca))
      width: 480
      height: 340
      renderFun: .bootPlot
      clearWith: *cw

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

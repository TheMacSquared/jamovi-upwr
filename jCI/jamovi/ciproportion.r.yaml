---
name: ciproportion
title: Przedział ufności dla proporcji
jrs: '1.1'

items:
    - name: table
      title: Przedział ufności dla proporcji
      type: Table
      rows: 1
      clearWith: &cw
        - dep
        - level
        - ciWidth
        - ciMethod
        - nBoot
        - seed
      columns:
        - name: var
          title: ''
          type: text
        - name: level
          title: Sukces
          type: text
        - name: count
          title: Liczba sukcesów
          type: integer
        - name: total
          title: N
          type: integer
        - name: estimate
          title: Proporcja
          type: number
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności

    - name: plot
      title: ''
      type: Image
      visible: (plot)
      width: 420
      height: 400
      renderFun: .ciPlot
      clearWith: *cw

    - name: bootPlot
      title: Rozkład bootstrapowy
      type: Image
      visible: (bootPlot && (ciMethod:perc || ciMethod:bca))
      width: 480
      height: 340
      renderFun: .bootPlot
      clearWith: *cw

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

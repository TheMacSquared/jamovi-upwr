title: Przedział ufności dla różnicy średnich
name: citwomeans
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienna
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Zmienna grupująca
        children:
          - type: VariablesListBox
            name: group
            isTarget: true
            maxItemCount: 1

  # --- rdzeń ---
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Przedział ufności
            children:
              - type: TextBox
                name: ciWidth
                suffix: '%'
                format: number
              - type: ComboBox
                name: ciMethod
          - type: Label
            label: Wielkość efektu
            children:
              - type: CheckBox
                name: effSize
          - type: Label
            label: Grupy (gdy więcej niż 2 poziomy)
            children:
              - type: LevelSelector
                name: level1
                enable: (group)
              - type: LevelSelector
                name: level2
                enable: (group)
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Wykres
            children:
              - type: CheckBox
                name: plot
          - type: Label
            label: Opis metod
            children:
              - type: CheckBox
                name: metody

  # --- zaawansowane: parametry bootstrapu (działają tylko przy metodzie bootstrap) ---
  - type: CollapseBox
    label: Zaawansowane
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: Label
            label: Bootstrap
            children:
              - type: TextBox
                name: nBoot
                format: number
              - type: TextBox
                name: seed
                format: number
              - type: CheckBox
                name: bootPlot

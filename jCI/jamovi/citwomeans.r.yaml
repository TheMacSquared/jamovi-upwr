---
name: citwomeans
title: Przedział ufności dla różnicy średnich
jrs: '1.1'

items:
    - name: table
      title: Przedział ufności dla różnicy średnich
      type: Table
      rows: 1
      clearWith: &cw
        - dep
        - group
        - level1
        - level2
        - ciWidth
        - ciMethod
        - effSize
        - nBoot
        - seed
      columns:
        - name: var
          title: ''
          type: text
        - name: group1
          title: Grupa 1
          type: text
        - name: group2
          title: Grupa 2
          type: text
        - name: estimate
          title: Różnica średnich
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności
        - name: d
          title: d Cohena
          type: number
          visible: (effSize)
        - name: dLower
          title: Dolna
          type: number
          superTitle: Przedział ufności d
          visible: (effSize)
        - name: dUpper
          title: Górna
          type: number
          superTitle: Przedział ufności d
          visible: (effSize)

    - name: plot
      title: ''
      type: Image
      visible: (plot)
      width: 520
      height: 400
      renderFun: .ciPlot
      clearWith: *cw

    - name: bootPlot
      title: Rozkład bootstrapowy
      type: Image
      visible: (bootPlot && (ciMethod:perc || ciMethod:bca))
      width: 480
      height: 340
      renderFun: .bootPlot
      clearWith: *cw

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

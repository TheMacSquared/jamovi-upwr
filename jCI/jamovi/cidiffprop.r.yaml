---
name: cidiffprop
title: Przedział ufności dla różnicy proporcji
jrs: '1.1'

items:
    - name: table
      title: Przedział ufności dla różnicy proporcji
      type: Table
      rows: 1
      clearWith: &cw
        - dep
        - group
        - level
        - groupLevel1
        - groupLevel2
        - ciWidth
        - ciMethod
        - nBoot
        - seed
      columns:
        - name: var
          title: ''
          type: text
        - name: group1
          title: Grupa 1
          type: text
        - name: group2
          title: Grupa 2
          type: text
        - name: p1
          title: p̂₁
          type: number
        - name: p2
          title: p̂₂
          type: number
        - name: estimate
          title: Różnica
          type: number
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności

    - name: plot
      title: ''
      type: Image
      visible: (plot)
      width: 520
      height: 400
      renderFun: .ciPlot
      refs: ggplot2
      clearWith: *cw

    - name: bootPlot
      title: Rozkład bootstrapowy
      type: Image
      visible: (bootPlot && (ciMethod:perc || ciMethod:bca))
      width: 480
      height: 340
      renderFun: .bootPlot
      refs: [ggplot2, boot]
      clearWith: *cw

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

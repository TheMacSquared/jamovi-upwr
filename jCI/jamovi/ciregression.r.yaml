---
name: ciregression
title: Przedział ufności dla współczynników regresji
jrs: '1.1'

items:
    - name: table
      title: Współczynniki regresji
      type: Table
      rows: 0
      clearWith: &cw
        - dep
        - pred
        - ciWidth
        - ciMethod
        - nBoot
        - seed
      columns:
        - name: term
          title: ''
          type: text
        - name: estimate
          title: Współczynnik
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności

    - name: plot
      title: ''
      type: Image
      visible: (plot)
      width: 540
      height: 400
      renderFun: .ciPlot
      clearWith: *cw

    - name: bootPlot
      title: Rozkład bootstrapowy
      type: Image
      visible: (bootPlot && (ciMethod:perc || ciMethod:bca))
      width: 480
      height: 340
      renderFun: .bootPlot
      clearWith: *cw

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

---
name: cionemean
title: Przedział ufności dla średniej
jrs: '1.1'

items:
    - name: table
      title: Przedział ufności dla średniej
      type: Table
      rows: 0
      clearWith: &cw
        - dep
        - group
        - stat
        - trimProp
        - ciWidth
        - ciMethod
        - nBoot
        - seed
      columns:
        - name: var
          title: ''
          type: text
          combineBelow: true
        - name: grp
          title: Grupa
          type: text
        - name: n
          title: n
          type: integer
        - name: estimate
          title: Średnia
          type: number
        - name: se
          title: SE
          type: number
        - name: lower
          title: Dolna
          type: number
          superTitle: Przedział ufności
        - name: upper
          title: Górna
          type: number
          superTitle: Przedział ufności

    - name: plot
      title: ''
      type: Image
      visible: (plot)
      width: 520
      height: 400
      renderFun: .ciPlot
      clearWith: *cw

    - name: bootPlots
      title: Rozkład bootstrapowy
      type: Array
      visible: (bootPlot && (ciMethod:perc || ciMethod:bca))
      clearWith: *cw
      template:
        title: ''
        type: Image
        width: 480
        height: 340
        renderFun: .bootPlot

    - name: metody
      title: Zastosowane metody
      type: Html
      visible: (metody)
...

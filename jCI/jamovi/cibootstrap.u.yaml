title: Jak działa bootstrap
name: cibootstrap
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienna
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
            maxItemCount: 1

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Losowanie
            children:
              - type: TextBox
                name: nBoot
                format: number
              - type: TextBox
                name: seed
                format: number
              - type: TextBox
                name: ciWidth
                suffix: '%'
                format: number
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Zbieżność
            children:
              - type: CheckBox
                name: showConvergence
          - type: Label
            label: Opis metod
            children:
              - type: CheckBox
                name: metody

title: Zdarzenia i warunkowanie
name: eventtables
jus: '2.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: A — ekspozycja / warunek
        children:
          - type: VariablesListBox
            name: varA
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: B — zdarzenie
        children:
          - type: VariablesListBox
            name: varB
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Liczność (opcjonalnie)
        children:
          - type: VariablesListBox
            name: countVar
            maxItemCount: 1
            isTarget: true
  - type: LevelSelector
    name: levelA
    enable: (varA)
  - type: LevelSelector
    name: levelB
    enable: (varB)
  - type: Label
    label: Wyniki
    children:
      - type: CheckBox
        name: showConditional
      - type: CheckBox
        name: showRisk
      - type: CheckBox
        name: showDetector
      - type: CheckBox
        name: showNaturalFreq
      - type: CheckBox
        name: showTree

---
name: lifetime
title: Modele czasu zycia
jrs: '1.1'

items:
    - name: atTable
      title: Funkcje niezawodnościowe w czasie t
      type: Table
      rows: 1
      visible: (mode:parametric)
      columns:
        - name: tcol
          title: t
          type: number
        - name: ft
          title: f(t)
          type: number
        - name: Ft
          title: F(t)
          type: number
        - name: Rt
          title: R(t) = 1 − F(t)
          type: number
        - name: ht
          title: h(t) = f(t)/R(t)
          type: number

    - name: summaryTable
      title: Charakterystyki modelu
      type: Table
      rows: 0
      visible: (mode:parametric)
      columns:
        - name: quantity
          title: ""
          type: text
        - name: formula
          title: Wzór
          type: text
        - name: value
          title: Wartość
          type: text

    - name: dataCounts
      title: Dane czasu życia
      type: Table
      rows: 1
      visible: (mode:data)
      columns:
        - name: n
          title: n
          type: integer
        - name: events
          title: Awarie
          type: integer
        - name: censored
          title: Cenzurowane
          type: integer
        - name: kmMedian
          title: Mediana KM
          type: number

    - name: fitTable
      title: Dopasowanie modeli (MLE z cenzorowaniem prawostronnym)
      type: Table
      rows: 0
      visible: (mode:data)
      columns:
        - name: model
          title: Model
          type: text
        - name: logLik
          title: logLik
          type: number
        - name: aic
          title: AIC
          type: number
        - name: bic
          title: BIC
          type: number

    - name: paramTable
      title: Parametry (95% CI)
      type: Table
      rows: 0
      visible: (mode:data)
      columns:
        - name: model
          title: Model
          type: text
        - name: param
          title: Parametr
          type: text
        - name: est
          title: Estymata
          type: number
        - name: lower
          title: Dolna
          type: number
        - name: upper
          title: Górna
          type: number

    - name: dataAtTable
      title: R(t) w zadanym czasie
      type: Table
      rows: 0
      visible: (mode:data)
      columns:
        - name: model
          title: Model
          type: text
        - name: rt
          title: R(t)
          type: number

    - name: plotR
      title: Funkcja niezawodności R(t)
      type: Image
      width: 500
      height: 400
      renderFun: .plotR
      visible: (plotReliability && mode:parametric)

    - name: plotH
      title: Intensywność uszkodzeń h(t)
      type: Image
      width: 500
      height: 400
      renderFun: .plotH
      visible: (plotHazard && mode:parametric)

    - name: plotF
      title: Gęstość f(t)
      type: Image
      width: 500
      height: 400
      renderFun: .plotF
      visible: (plotDensity && mode:parametric)

    - name: kmPlot
      title: Kaplan–Meier i dopasowane modele
      type: Image
      width: 560
      height: 420
      renderFun: .plotKM
      visible: (plotReliability && mode:data)

    - name: hazPlot
      title: Intensywności uszkodzeń dopasowanych modeli
      type: Image
      width: 560
      height: 420
      renderFun: .plotHaz
      visible: (plotHazard && mode:data)
...

---
name: lifetime
title: Modele czasu zycia
menuGroup: Ryzyko
version: '0.2.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: mode
      title: Tryb
      type: List
      options:
        - title: Parametry (znany model)
          name: parametric
        - title: Dane (dopasowanie modeli)
          name: data
      default: parametric

    - name: timeVar
      title: Czas
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null

    - name: statusVar
      title: Status zdarzenia (opcjonalnie)
      type: Variable
      suggested:
        - nominal
      default: null

    - name: failureLevel
      title: Poziom oznaczający awarię
      type: Level
      variable: (statusVar)
      allowNone: true

    - name: distribution
      title: Rozkład czasu życia
      type: List
      options:
        - title: Wykładniczy
          name: exponential
        - title: Gamma
          name: gamma
        - title: Weibulla
          name: weibull
      default: exponential

    - name: expRate
      title: Intensywność (λ) =
      type: Number
      default: 1
      min: 0.0001

    - name: gammaShape
      title: Kształt (α) =
      type: Number
      default: 2
      min: 0.0001

    - name: gammaRate
      title: Intensywność (λ) =
      type: Number
      default: 1
      min: 0.0001

    - name: weibullShape
      title: Kształt (β) =
      type: Number
      default: 1.5
      min: 0.0001

    - name: weibullScale
      title: Skala (η) =
      type: Number
      default: 1
      min: 0.0001

    - name: t
      title: Czas t =
      type: Number
      default: 1
      min: 0

    - name: showMTTF
      title: MTTF (oczekiwany czas życia)
      type: Bool
      default: true

    - name: showMedian
      title: Mediana czasu życia
      type: Bool
      default: true

    - name: plotReliability
      title: Wykres funkcji niezawodności R(t)
      type: Bool
      default: true

    - name: plotHazard
      title: Wykres intensywności uszkodzeń h(t)
      type: Bool
      default: true

    - name: plotDensity
      title: Wykres gęstości f(t)
      type: Bool
      default: false
...

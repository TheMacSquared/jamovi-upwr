---
name: eventtables
title: Zdarzenia i warunkowanie
jrs: '1.1'

items:
    - name: countsTable
      title: Tabela liczebności 2×2
      type: Table
      rows: 3
      columns:
        - name: rowLabel
          title: ""
          type: text
        - name: b
          title: B
          type: integer
        - name: notb
          title: Bᶜ
          type: integer
        - name: total
          title: Suma
          type: integer

    - name: probTable
      title: Prawdopodobieństwa
      type: Table
      rows: 0
      columns:
        - name: quantity
          title: ""
          type: text
        - name: formula
          title: Wzór
          type: text
        - name: value
          title: Wartość
          type: number

    - name: detectorTable
      title: Metryki detektora
      type: Table
      rows: 0
      visible: (showDetector)
      columns:
        - name: quantity
          title: ""
          type: text
        - name: formula
          title: Wzór
          type: text
        - name: value
          title: Wartość
          type: number

    - name: freqTable
      title: Częstości naturalne (na 1000 przypadków)
      type: Table
      rows: 3
      visible: (showNaturalFreq)
      columns:
        - name: rowLabel
          title: ""
          type: text
        - name: b
          title: B
          type: number
        - name: notb
          title: Bᶜ
          type: number
        - name: total
          title: Suma
          type: number

    - name: treePlot
      title: Drzewo częstości
      type: Image
      refs: ggplot2
      width: 640
      height: 460
      renderFun: .plotTree
      visible: (showTree)
...

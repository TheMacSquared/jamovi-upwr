---
name: eventtables
title: Zdarzenia i warunkowanie
menuGroup: Ryzyko
version: '0.4.0'
jas: '1.2'
weightsSupport: 'full'

options:
    - name: data
      type: Data

    - name: varA
      title: A — ekspozycja / warunek (zmienna)
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor
      default: null

    - name: levelA
      title: Poziom oznaczający A
      type: Level
      variable: (varA)

    - name: varB
      title: B — zdarzenie (zmienna)
      type: Variable
      suggested:
        - nominal
      permitted:
        - factor
      default: null

    - name: levelB
      title: Poziom oznaczający B
      type: Level
      variable: (varB)

    - name: showConditional
      title: Prawdopodobieństwa warunkowe i reguła iloczynu
      type: Bool
      default: true

    - name: showDetector
      title: Metryki detektora (A = stan rzeczywisty, B = alarm/test)
      type: Bool
      default: false

    - name: showNaturalFreq
      title: Częstości naturalne
      type: Bool
      default: false

    - name: showTree
      title: Drzewo częstości
      type: Bool
      default: false

    - name: showRisk
      title: Porównanie ryzyk (RD, RR)
      type: Bool
      default: false

    - name: countVar
      title: Liczność (opcjonalnie)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default: null
...

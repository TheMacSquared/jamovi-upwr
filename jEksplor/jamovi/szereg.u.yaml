title: Szereg rozdzielczy
name: szereg
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Zmienna
        children:
          - type: VariablesListBox
            name: var
            isTarget: true
            maxItemCount: 1
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Klasy
            children:
              - type: ComboBox
                name: method
              - type: TextBox
                name: nClasses
                format: number
                enable: (method:count)
              - type: TextBox
                name: width
                format: number
                enable: (method:width)
              - type: CheckBox
                name: startAuto
              - type: TextBox
                name: start
                format: number
                enable: (!startAuto)
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Statystyki z szeregu
            children:
              - type: CheckBox
                name: compare
          - type: Label
            label: Wykres
            children:
              - type: CheckBox
                name: plot
              - type: CheckBox
                name: ogive
          - type: Label
            label: Opis metod
            children:
              - type: CheckBox
                name: metody

---
name: zalezne
title: Próby zależne
menuGroup: Frequencies
menuTitle: Próby zależne
menuSubtitle: te same jednostki, powtórzone pomiary
version: '1.0.0'
jas: '1.2'

options:
    - name: data
      type: Data

    # --- rdzeń ---
    # 2 pomiary → McNemar, 3 i więcej → Q Cochrana (metoda dobierana sama)
    - name: vars
      title: Pomiary
      type: Variables
      suggested:
        - nominal
      permitted:
        - factor

    - name: counts
      title: Liczności (opcjonalnie, 2 pomiary)
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      default:

    - name: effSize
      title: Wielkość efektu (OR par niezgodnych)
      type: Bool
      default: true

    - name: props
      title: Udziały w pomiarach
      type: Bool
      default: true

    - name: table
      title: Tabela par
      type: Bool
      default: true

    - name: plot
      title: Udziały w pomiarach (słupki)
      type: Bool
      default: false

    # --- zaawansowane ---
    - name: exact
      title: Dokładny test (dwumianowy na parach)
      type: Bool
      default: false

    - name: corr
      title: Poprawka ciągłości
      type: Bool
      default: false

    - name: posthoc
      title: Porównania par pomiarów (Holm)
      type: Bool
      default: false

    - name: ciWidth
      title: Poziom ufności
      type: Number
      min: 50
      max: 99.9
      default: 95

    # --- opis metod (wspólny mechanizm jUPWR: jmvcore::metodyNew) ---
    - name: metody
      title: Opis zastosowanych metod
      type: Bool
      default: false
...

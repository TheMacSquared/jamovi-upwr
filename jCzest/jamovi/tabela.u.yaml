title: Tabela kontyngencji
name: tabela
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Wiersze
        children:
          - type: VariablesListBox
            name: rows
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Kolumny
        children:
          - type: VariablesListBox
            name: cols
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        label: Liczności (opcjonalnie)
        children:
          - type: VariablesListBox
            name: counts
            isTarget: true
            maxItemCount: 1

  # --- rdzeń: widoczny od razu ---
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
          column: 0
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Test i wielkość efektu
            children:
              - type: CheckBox
                name: chiSq
              - type: CheckBox
                name: fisher
              - type: CheckBox
                name: effSize
      - type: LayoutBox
        cell:
          column: 1
          row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Procenty
            children:
              - type: ComboBox
                name: pc
          - type: Label
            label: Wykres
            children:
              - type: ComboBox
                name: plot
          - type: Label
            label: Opis metod
            children:
              - type: CheckBox
                name: metody

  # --- zaawansowane ---
  # Warunek stosowalności χ² sprawdzany jest automatycznie (ostrzeżenie nad
  # wynikami), więc nie ma osobnej sekcji „Założenia" — zostałaby w niej
  # jedna kontrolka.
  - type: CollapseBox
    label: Zaawansowane
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Dodatkowe testy
                children:
                  - type: CheckBox
                    name: chiSqCorr
                  - type: CheckBox
                    name: likeRat
                  - type: CheckBox
                    name: trend
              - type: Label
                label: Post-hoc
                children:
                  - type: CheckBox
                    name: resid
                  - type: CheckBox
                    name: pairwise
              - type: Label
                label: Liczności
                children:
                  - type: CheckBox
                    name: exp
              - type: Label
                label: Zmienne porządkowe
                children:
                  - type: CheckBox
                    name: gamma
                  - type: CheckBox
                    name: taub
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Tabela 2×2
                children:
                  - type: CheckBox
                    name: odds
                  - type: CheckBox
                    name: relRisk
                  - type: CheckBox
                    name: diffProp
                  - type: ComboBox
                    name: compare
              - type: Label
                label: Przedziały ufności
                children:
                  - type: CheckBox
                    name: effSizeCI
                  - type: TextBox
                    name: ciWidth
                    suffix: '%'
                    format: number
